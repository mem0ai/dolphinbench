- id: 248
  statement: 'For Mercury activation surface v0.2, the reviewed state map is four branches: no source
    connected, invited member waiting on admin / first source, first sync queued, and sync failed. Locked
    CTA labels are no source “Connect a data source,” invited member “View setup guide,” queued no primary
    CTA, and failed “Try again.” Sample data must not create an activated-looking path; if present it
    must be visually separate, preview-only, and excluded from activation events. Invited-member rendering
    must use server role + source state, queued sync cannot show fake percent or ETA countdown, and failed
    sync needs normalized auth / permissions, source unavailable / timeout, and unknown / retry buckets
    with idempotent retry and no raw vendor strings in UI.'
  applies_when: Mercury activation surface v0.2 product, release-readiness, and QA work until the state
    map or release gates are explicitly changed.
