- id: 20
  statement: 'On Mar 15 at 9pm, while still in the outage, Morgan described the repro: a request on the
    new path hit a cache miss, fell through to the old entitlement check, then retried against the worker
    pool and piled up there. Morgan said the ten-line change looked harmless because the diff was tiny,
    but it had an asymmetric blast radius: only some tenants hit the bad branch, and for those tenants
    one request fanned out into roughly 6-8 internal calls, with queued jobs leaving stragglers even after
    traffic was rolled back.'
  applies_when: Specifically during the Mar 15 evening outage update at about 9pm, while the incident
    was still active.
