  statement: From April 9 through June 30, 2025, each Harbor Health and Mosaic Commerce lookup uses the
    shared authorization wrapper, and access remains read-only and limited to provenance-backed deploy
    events, published service ownership, timestamped incident-load summaries, and explicit unknown states.
    Cost data, raw incident text, internal room metadata, employee identifiers or comparisons, inferred
    or unpublished ownership, internal-only fallback data, write access, and new accounts remain excluded.
    The complete automatic technical stop conditions are any authorization-wrapper bypass; any adapter
    call after a denial; any cross-tenant material; any stale or missing source rendered as something
    other than explicit unknown; any deploy event without required provenance; any unpublished ownership;
    any incident-load summary without its source timestamp; any exposure of raw incident text, internal
    room metadata, individual comparisons, inferred ownership, or fallback internal-only metadata; or
    any loss of read-only enforcement. If any such condition occurs, all pilot access is immediately suspended
    pending correction and a successful rerun of the affected safety check; latency and other errors do
    not independently stop the pilot unless they cause one of those violations.
