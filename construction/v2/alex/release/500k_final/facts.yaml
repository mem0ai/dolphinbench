- id: 332
  statement: For the authorized Harbor Health and Mosaic Commerce pilot, every lookup must use the shared
    authorization wrapper, and each account is limited to provenance-backed deploy events, published service
    ownership, incident-load summaries with source timestamps, and explicit unknown states when data is
    absent. The complete automatic technical stop conditions are any authorization-wrapper bypass; any
    adapter call after a denial; any cross-tenant material; any stale or missing source rendered as something
    other than explicit unknown; any deploy event without required provenance; any unpublished ownership;
    any incident-load summary without its source timestamp; any exposure of raw incident text, internal
    room metadata, individual comparisons, inferred ownership, or fallback internal-only metadata; or
    any loss of read-only enforcement. Any stop condition immediately suspends all pilot access pending
    correction and a successful rerun of the affected safety check; latency and other error signals are
    monitored but are not independent automatic stops unless they cause one of the listed violations.
  applies_when: When preparing the authorized Lantern pilot before March 10 and determining its approved
