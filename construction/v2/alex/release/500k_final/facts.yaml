- id: 393
  statement: Through December 4, 2025, the owner map listed Alex as metrics-router primary and Wes as
    backup. Effective December 5, 2025, Wes is the formal metrics-router primary and Alex is its formal
    backup owner. Wes owns routine metrics-router implementation, production operations, release and rollback
    decisions, and opening owner-led windows under the established deploy-pipeline, canary, health-return,
    stop, and rollback rules. Alex is no longer metrics-router primary or its routine release gate; he
    provides backup coverage when Wes is unavailable and remains the architectural reviewer and escalation
    path when a cross-service invariant, provenance, or failure-mode exception is triggered. Wes's formal
    metrics-router ownership does not expand his shard-keeper scope. Shard-keeper remains outside his
    solo scope unless Alex or the Cyrus-team backup explicitly pairs with him. For the bounded metrics-router
    scale response, Wes continues to own implementation and load-test evidence; Cyrus and Roman continue
    to own rollup-service capacity and parity evidence; and Nadia continues to own queue and refusal alert
    semantics. Ingest-edge remains Alex primary with Yuki backup; shard-keeper remains Alex primary with
    the Cyrus team as backup; Nadia continues to own alerting and dashboards; and rollup-service remains
    owned by the Cyrus team. For ingest-edge, Wes remains a genuine practical backup rather than a formal
    primary owner, and Alex continues not to shadow every safe ingest-edge first-pass decision that falls
    within Wes's practical backup scope.
