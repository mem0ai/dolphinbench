    timestamp; every incident-load summary has a source timestamp; stale or missing inputs render as explicit
    unknown; and at least one operational contact is recorded in the pilot access configuration. Exactly
    two other candidate accounts remain deferred because each failed at least one criterion. Hema and
    Theo authorized uninterrupted read-only access for Harbor Health and Mosaic Commerce from April 9
    through June 30, 2025 and, beginning July 1, 2025, authorized those same two accounts to continue
    uninterrupted through October 10, 2025; all other customer access remained closed throughout those
    periods. The October 8 decision left that authorization in force through October 10, 2025 and authorized
    the same two accounts, and no others, to continue uninterrupted with read-only access beginning October
    11, 2025 through March 31, 2026. From April 1 through September 30, 2026, Harbor Health and Mosaic
    Commerce, and no other accounts, continue with read-only access; broader customer access remains unauthorized.
    Beginning October 1, 2026, Hema and Theo authorize Harbor Health and Mosaic Commerce, and no other
    accounts, to continue through March 31, 2027 with read-only access through the shared authorization
    wrapper.'
