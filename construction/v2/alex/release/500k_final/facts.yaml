- id: 430
  statement: 'From May 28 through July 2, 2026, a historical service identifier for Harbor Health or Mosaic
    Commerce is eligible for resolution only when the tenant-scoped owner map publishes an alias record
    containing the old identifier, the canonical published service identifier, and an effective interval
    covering the source event timestamp. Beginning July 3, 2026, Lantern evaluates every tenant-scoped
    owner-map alias whose inclusive effective interval covers the source event timestamp: if all qualifying
    records identify the same canonical published service, Lantern may resolve that identity once; if
    qualifying records identify two or more distinct canonical services, Lantern keeps the signals separate
    and renders ownership as explicit unknown regardless of storage order. Both the effective interval''s
    start timestamp and end timestamp are inclusive. If no qualifying record exists, Lantern keeps the
    signals separate and renders ownership as explicit unknown; it does not infer a rename from similar
    names or customer context. Harbor Health''s original `claims-edge` event joins to published `claims-ingest`
    ownership because its source timestamp falls within the owner map''s published alias interval. In
    the original 28 executed regression fixtures, all 12 valid in-interval aliases joined to their canonical
    published service identifiers, while eight out-of-interval aliases and eight identifiers with no published
    alias record remained separate with explicit unknown ownership. The July 3 regressions show the overlapping
    Harbor Health records for `claims-ingest` and `claims-router` failing closed in both storage orders,
    both inclusive endpoints working, and a single valid match resolving normally. Alex''s affected safety
    rerun found no cross-tenant resolution, missing provenance, unpublished ownership render, excluded
    field, adapter call after denial, or loss of read-only enforcement. The approved customer-facing language
    remains `Published service identity resolved from an owner-map alias effective at this source event
    timestamp.` for an authorized join and `Ownership unknown: no published owner-map alias covers this
    source event timestamp.` when no qualifying alias record covers the timestamp. This resolution applies
    only to Harbor Health and Mosaic Commerce and does not expand the customer data contract or change
    their read-only scope.'
  applies_when: When Lantern resolves historical service identifiers for Harbor Health or Mosaic Commerce,
    including overlapping tenant-scoped owner-map aliases, on or after July 3, 2026.
