- id: 377
  statement: Alex opened the owner-led metrics-router production window on September 24, 2025. Wes moved
    the tenant-bounded queue control through 10% and 50% that day using the deploy pipeline and to 100%
    on September 25 after every required health set returned to baseline. Friday, September 26, was monitoring
    only, with no production push. At a production peak of 14.2 million data points per minute, queue-wait
    p99 held at 240 milliseconds, retryable queue-full responses remained at 0.06%, no accepted points
    were lost, and consistency, parity, dropped-series, route, shard-keeper lease, rollup-service, and
    full-health checks remained at baseline through the September 26 hold. No stop threshold or rollback
    condition was reached, and metrics-router now runs the tenant-bounded queue and retryable backpressure
