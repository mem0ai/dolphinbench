- id: 539
  statement: 'During the scheduled Tuesday, October 19, 2027 owner-held window from 10:00 to 11:00 AM,
    Yuki released the ingest-edge decoder controls and observed them through 11:00 AM on October 20. Production
    ingest-edge enforces one 1,048,576-byte aggregate decoded-attribute limit across all gzip members
    and a 72-request decode-admission cap. Requests with exactly 1,048,576 decoded attribute bytes pass,
    requests with 1,048,577 bytes fail before acceptance and enqueue regardless of gzip-member layout,
    and work above the 72-request cap receives retryable pre-acceptance results. The existing 8,000-point
    whole-batch rule and limit of eight waiting requests per tenant remain in force. Every accepted request
    has exactly one terminal outcome, no over-limit work is enqueued, and every admission slot is released
    exactly once after success, rejection, malformed input, cancellation, or disconnect. The release required
    rollback for any over-limit work accepted or enqueued, any accepted request without exactly one terminal
    outcome, or any admission slot not released exactly once. For the percentage rollback checks, the
    fixed baseline was the uncapped baseline used in the September 8 sustained representative run: its
    accepted throughput measurement was the baseline for accepted throughput, and its p99 completion time
    measurement was the baseline for p99 completion time. The percentage rollback conditions were accepted
    throughput more than 5% below that fixed accepted throughput baseline for five consecutive minutes
    or p99 completion time more than 10% above that fixed p99 completion time baseline for five consecutive
    minutes. Accepted throughput was 0.6% below its fixed baseline and p99 completion time was 2.2% above
    its fixed baseline; neither five-consecutive-minute rollback threshold was reached. Yuki closed the
    window without rollback and retains implementation, release, and rollback authority for these controls.'
  applies_when: When ingest-edge decodes attributes, admits decode work, or applies the associated production
    ownership and accounting rules after the October 19, 2027 release, or when reviewing the release and
    its observation result.
  source_session_ids:
