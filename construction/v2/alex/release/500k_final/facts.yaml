    pushes while retired generations remain at four or fewer, cleanup pauses remain at or below 100 milliseconds,
    and the full health set returns to baseline after every push. Exceeding either threshold stops the
    window. After recovery, a fresh decision permits exactly one fully observed push; another window requires
    a separate fresh decision after that push returns the full health set to baseline. The established
