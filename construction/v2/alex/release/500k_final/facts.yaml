- id: 386
  statement: From April 9 through June 30, 2025, each Harbor Health and Mosaic Commerce lookup continues
    to use the shared authorization wrapper, and access remains read-only and limited to provenance-backed
    deploy events, published service ownership, timestamped incident-load summaries, and explicit unknown
    states. Beginning July 1, 2025, that lookup and access rule continues uninterrupted through October
    10, 2025. From April 9 through October 10, 2025, cost data, raw incident text, internal room metadata,
    employee identifiers or comparisons, inferred or unpublished ownership, internal-only fallback data,
    write access, and additional accounts remain excluded. During the April 9 through October 10, 2025
    periods, the complete automatic technical stop conditions are any authorization-wrapper bypass; any
    adapter call after a denial; any cross-tenant material; any stale or missing source rendered as something
    other than explicit unknown; any deploy event without required provenance; any unpublished ownership;
    any incident-load summary without its source timestamp; any exposure of raw incident text, internal
    room metadata, individual comparisons, inferred ownership, or fallback internal-only metadata; or
    any loss of read-only enforcement. During the April 9 through October 10, 2025 periods, any listed
    stop condition immediately suspended all pilot access pending correction and a successful rerun of
    the affected safety check. During the April 9 through October 10, 2025 periods, latency and other
    errors do not independently stop the preview unless they cause one of those automatic technical stop
    conditions. Beginning October 11, 2025, every Harbor Health and Mosaic Commerce lookup continues to
    use the shared authorization wrapper, and read-only access remains limited to provenance-backed deploy
    movement, published service ownership, timestamped incident-load summaries, and explicit unknown states
    through March 31, 2026. During the October 11, 2025 through March 31, 2026 continuation, no additional
    account, cost data, CSV export, raw incident text, internal room metadata, employee identifier or
    comparison, inferred or unpublished ownership, internal-only fallback data, or write capability is
    authorized. During that continuation, an authorization-wrapper bypass, an adapter call after denial,
    cross-tenant material, a stale or missing source rendered as anything other than explicit unknown,
    a deploy event without required provenance, unpublished ownership, an incident-load summary without
    its source timestamp, exposure of any excluded field, or loss of read-only enforcement immediately
    suspends both accounts pending correction and a successful rerun of the affected safety check. During
    that continuation, latency and other errors do not independently suspend the preview unless they cause
    one of those violations.
  applies_when: When operating or reviewing the Harbor Health and Mosaic Commerce Lantern preview from
