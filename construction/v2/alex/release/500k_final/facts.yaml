- id: 425
  statement: Until Product Engineering actually completes the published-alias implementation, Lantern
    keeps the Harbor Health `claims-edge` deploy signal separate from `claims-ingest` and renders ownership
    as explicit unknown; this avoids a false ownership claim and triggers no automatic-stop condition
    but leaves no usable combined service explanation. Product Engineering must implement by May 28, 2026
    a rule under which Lantern may resolve a historical service identifier only when the tenant-scoped
    owner map publishes an alias record containing the old identifier, the canonical published service
    identifier, and an effective interval that covers the source event's timestamp. Both the effective
    interval's start timestamp and end timestamp are inclusive, so a source event timestamp equal to either
    endpoint is covered. If no such record exists, the source event timestamp is earlier than the inclusive
    start timestamp, or the source event timestamp is later than the inclusive end timestamp, Lantern
    must keep the signals separate and render ownership as explicit unknown. The UI may not infer a rename
    from similar names or customer context. May 28, 2026 is the implementation deadline and does not itself
    establish completion. Product Engineering owns implementation by May 28, 2026, Alex owns positive
    and negative safety regressions, and Iris owns the customer-facing wording.
  applies_when: When implementing or reviewing provenance-backed service-alias resolution for Lantern
    from the May 14, 2026 decision until Product Engineering actually completes the implementation; May
    28, 2026 is the implementation deadline, not an assumed deployment date.
  source_session_ids:
