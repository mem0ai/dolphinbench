- id: 426
  statement: 'Beginning May 28, 2026, Lantern uses tenant-scoped service-alias resolution for Harbor Health
    and Mosaic Commerce. A historical service identifier resolves only when the tenant-scoped owner map
    publishes an alias record containing the old identifier, the canonical published service identifier,
    and an effective interval covering the source event''s timestamp. Both the effective interval''s start
    timestamp and end timestamp are inclusive, so a source event timestamp equal to either endpoint is
    covered. If no such record exists, the source event timestamp is earlier than the inclusive start
    timestamp, or the source event timestamp is later than the inclusive end timestamp, Lantern keeps
    the signals separate and renders ownership as explicit unknown; it does not infer a rename from similar
    names or customer context. The original Harbor Health `claims-edge` event joins to published `claims-ingest`
    ownership because its source timestamp falls within the owner map''s published alias interval under
    the inclusive-endpoint rule. In 28 executed regression fixtures, all 12 valid in-interval aliases
    joined to their canonical published service identifiers, while eight out-of-interval aliases and eight
    identifiers with no published alias record remained separate with explicit unknown ownership. Alex''s
    affected safety rerun found no cross-tenant resolution, missing provenance, unpublished ownership
    render, excluded field, adapter call after denial, or loss of read-only enforcement. Iris approved
    the exact customer-facing language `Published service identity resolved from an owner-map alias effective
    at this source event timestamp.` for an authorized join and `Ownership unknown: no published owner-map
    alias covers this source event timestamp.` when no qualifying alias record covers the timestamp. This
    resolution applies only to Harbor Health and Mosaic Commerce and does not expand the customer data
    contract.'
  applies_when: When Lantern resolves historical service identifiers for Harbor Health or Mosaic Commerce
    on or after May 28, 2026.
  source_session_ids:
