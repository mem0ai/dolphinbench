- id: 528
  statement: From April 9 through October 10, 2025, every Harbor Health and Mosaic Commerce lookup used
    the shared authorization wrapper, and read-only access was limited to provenance-backed deploy events,
    published service ownership, timestamped incident-load summaries, and explicit unknown states; cost
    data, raw incident text, internal room metadata, employee identifiers or comparisons, inferred or
    unpublished ownership, internal-only fallback data, write access, and additional accounts were excluded.
    From October 11, 2025 through March 31, 2026, every lookup continued through the shared authorization
    wrapper, and read-only access was limited to provenance-backed deploy movement, published service
    ownership, timestamped incident-load summaries, and explicit unknown states; no additional account,
    cost data, CSV export, raw incident text, internal room metadata, employee identifier or comparison,
    inferred or unpublished ownership, internal-only fallback data, or write capability was authorized.
    From April 1 through September 30, 2026, the same lookup, read-only scope, and exclusions continued.
    From October 1, 2026 through March 31, 2027, Harbor Health and Mosaic Commerce retained the same read-only
    access, and no additional account, cost data, CSV export, raw incident text, internal room metadata,
    employee identifier or comparison, inferred or unpublished ownership, internal-only fallback data,
    write capability, release-readiness judgment, or employee-performance interpretation was authorized.
    The authorization remained unchanged through March 31, 2027. Beginning April 1, 2027 and continuing
    through September 30, 2027, every Harbor Health and Mosaic Commerce lookup remained behind the shared
    authorization wrapper, and read-only access remained limited to provenance-backed deploy movement,
    published service ownership, timestamped incident-load summaries, and explicit unknown states. During
    that term, cost data, CSV export, raw incident text, internal room metadata, employee identifiers
    or comparisons, inferred or unpublished ownership, internal-only fallback data, write capability,
    release-readiness judgments, employee-performance interpretations, the internal owner-map/Cardinality
    Guardrails reference navigation, and access for any other account remained unauthorized. During the
    separately authorized October 1, 2027–March 31, 2028 term, every Harbor Health and Mosaic Commerce
    lookup remains behind the shared authorization wrapper, and read-only access remains limited to provenance-backed
    deploy movement, published service ownership, timestamped incident-load summaries, and explicit unknown
    states. During that new term, cost data, CSV export, raw incident text, internal room metadata, employee
    identifiers or comparisons, inferred or unpublished ownership, internal-only fallback data, write
    capability, release-readiness judgments, employee-performance interpretations, the internal owner-map/Cardinality
    Guardrails reference navigation, and access for any other account remain unauthorized. During the
    April 9 through October 10, 2025 authorization periods, any authorization-wrapper bypass, adapter
    call after denial, cross-tenant material, stale or missing source rendered as anything other than
    explicit unknown, deploy event without required provenance, unpublished ownership, incident-load summary
    without its source timestamp, exposure of raw incident text, internal room metadata, individual comparisons,
    inferred ownership, or fallback internal-only metadata, or loss of read-only enforcement immediately
    suspended all pilot access pending correction and a successful rerun of the affected safety check.
    From October 11, 2025 through September 30, 2027, an authorization-wrapper bypass, adapter call after
    denial, cross-tenant material, stale or missing input rendered as anything other than explicit unknown,
    deploy event without required provenance, unpublished ownership, incident-load summary without its
    source timestamp, exposure of an excluded field, or loss of read-only enforcement immediately suspended
    both accounts pending correction and a successful rerun of the affected safety check. During the separately
    authorized October 1, 2027–March 31, 2028 term, an authorization-wrapper bypass, adapter call after
    denial, cross-tenant material, stale or missing input rendered as anything other than explicit unknown,
    deploy event without required provenance, unpublished ownership render, incident-load summary without
    its source timestamp, excluded-field exposure, or loss of read-only enforcement suspends both accounts
    pending correction and a successful rerun of the affected safety check. During every authorization
    period from April 9, 2025 through March 31, 2028, latency or another error does not independently
    suspend access unless it causes one of those violations.
