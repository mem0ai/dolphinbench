- id: 394
  statement: Through December 4, 2025, each metrics-router owner-led window required a fresh opening decision
    from Alex. Beginning December 5, 2025, Wes makes the fresh opening decision as metrics-router primary;
    Alex may make it when covering for an unavailable Wes. During an opened window, mapped operators may
    make single-file pushes while retired generations remain at four or fewer, cleanup pauses remain at
    or below 100 milliseconds, and the full health set returns to baseline after every push. Exceeding
    either threshold stops the window. After recovery, a fresh decision permits exactly one fully observed
    push. Through December 4, 2025, Alex made that recovery decision; beginning December 5, 2025, Wes
    makes it as metrics-router primary, or Alex makes it when covering for an unavailable Wes. Another
    window requires a separate fresh decision after that push returns the full health set to baseline.
    The established consistency, parity, dropped-series, reload, and restart conditions continue to require
    rollback. Wes, or Alex while covering for an unavailable Wes, does not make a fresh approval decision
    before every safe push within an opened window.
  applies_when: When Wes or another mapped operator conducts a metrics-router owner-led configuration
    window, including the ownership transition effective December 5, 2025.
