- id: 341
  statement: Lantern may combine provenance-backed deploy movement, published service ownership, and incident-load
    summaries only when all included signals belong to the same customer tenant and published service
    identifier, each signal independently passes its existing freshness check, each carries its required
    provenance and source timestamp, and the difference between the newest and oldest source timestamps
    is no more than 24 hours. If a source is stale or missing, Lantern renders that signal as explicit
    unknown and does not produce a combined explanation. If all sources are valid but their timestamps
    differ by more than 24 hours, Lantern displays the signals separately with their source timestamps
    and does not describe them as contemporaneous or causally connected. This rule adds no cost data or
    other new data to the preview.
  applies_when: When Lantern produces explanations using deploy movement, published service ownership,
    and incident-load signals during the customer pilot.
  source_session_ids:
