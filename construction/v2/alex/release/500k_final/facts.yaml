    implementation and release owner, the rollback owner, and any `invariant`, `provenance`, `failure_mode`,
    `ownership`, or `escalation` exception owner; without a listed exception, the mapped owner uses the
    ordinary release process, and a triggered exception owner reviews only that boundary. From May 12
    through August 5, 2027, a cross-service exception request must name the mapped implementation or release
    owner, select exactly one of `invariant`, `provenance`, `failure_mode`, `ownership`, or `escalation`,
    and state the observed failed or at-risk condition. During that period, if any required field is absent,
    the request returns to the mapped owner without entering Alex''s review lane; Alex reviews only the
    named boundary and does not approve implementation or release. The August 3, 2027 finding established
    that the cross-service exception intake had an open enforcement gap before August 6, 2027: a non-empty
    placeholder such as `needs review` or `possible risk` could enter reviewer routing without identifying
    an affected component''s observed behavior or a specific at-risk invariant. Nadia returned all six
    July requests that used such text before bounded review, and no implementation or release decision
    was made from them. Beginning August 6, 2027, Hema assigned Nadia ownership of front-door triage for
    asynchronous cross-service exception intake. Before routing, Nadia screens every request for four
    required pieces of information: the affected component, the mapped implementation or release owner,
    exactly one of `invariant`, `provenance`, `failure_mode`, `ownership`, or `escalation`, and the concrete
    observed failed or at-risk condition. If any one of those four pieces is missing, Nadia returns the
    request to the mapped owner without sending it into exception review, including but not limited to
    placeholder-only requests. A complete request goes to the named owner responsible for the selected
    boundary; Alex receives it only when that boundary requires his review, and Alex reviews only that
    boundary and does not approve implementation or release. Nadia does not make implementation, release,
    or rollback decisions, and those decisions remain with mapped owners.'
  applies_when: When submitting, screening, or routing an Infra cross-service exception request, assigning
    implementation, release, rollback, or selected-boundary review responsibility, or assessing the August
    3, 2027 placeholder-enforcement finding and its August 6, 2027 closure.
