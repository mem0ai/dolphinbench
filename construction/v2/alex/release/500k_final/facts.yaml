    configuration into Lantern''s shared registration path, so all three existing customer source families
    use shared registration for their safety metadata. The incident-load registration enforces tenant
    authorization before source access; uses Lantern Incident-Load Provenance Schema LILP-1 and its required
    tenant-scoped provenance source identifier; carries the required source timestamp; renders stale or
    missing input as explicit unknown; preserves the excluded-field list of cost data, CSV export, raw
    incident text, internal room metadata, employee identifiers or comparisons, inferred or unpublished
    ownership, and internal-only fallback data; and preserves read-only enforcement. The incident-load
    family passed Lantern Preview Safety Check LPS-001. Alex''s LPS-001 rerun covered 240 tenant-scoped
    lookups, with 120 for Harbor Health and 120 for Mosaic Commerce: 16 denied requests made no adapter
    call, 12 stale or missing inputs rendered explicit unknown, and no lookup produced an authorization-wrapper
    bypass, cross-tenant material, missing required provenance, a missing required source timestamp, an
    excluded field, unpublished ownership, or a write. Iris compared the incident-load explanations before
