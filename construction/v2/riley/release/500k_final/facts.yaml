- id: 332
  statement: The CS auto-nudge integration will consume the five governed fields without adding new semantics.
    A nudge may be evaluated only when each field's as-of time is within its recorded freshness limit,
    external-system authority has a verified-yes state that the account or an available owner can perform
    the connector's required owner-level permission or network-allowlist action, connector authentication
    is recorded as authenticated, entitlement is recorded as active, and a qualifying human admin is recorded
    as present. Recorded active Customer Success adoption or renewal work suppresses the nudge. If any
    required field is stale, unresolved, or conflicts with another downstream view, the system holds the
    decision. The external-system-authority field remains connector-readiness state and is not treated
    as permission for automated contact. Before release, the legacy nightly path remains live; it exposes
    only a feed-level timestamp, can preserve last-known qualifying-human-admin and Customer Success-work
    values when an individual source refresh lags, and does not show external-system-authority or connector-authentication
    state in the nudge operator view. Daniela scheduled a historical replay for April 24, 2025.
  applies_when: When building and validating the CS auto-nudge shared-state integration before production
    release.
  source_session_ids:
  - extension_riley_2025_04_09_002
  subjects:
  - riley
  - owen
  - ines
  - daniela
  - customer_success
  - lifecycle_systems_team
  - cs_auto_nudge_system
  supersedes: []
