  statement: 'The closed high-intent Helio Start paid-search cohort has complete day-90 outcomes for all
    50 workspaces, certified by Owen and Customer Success: 37 are paid-active, six canceled, four are
    past due, and three are on billing hold. The cohort produced $60,480 in gross billed cash and $56,230
    in refund-adjusted collected cash. Account-level support effort was 26 minutes at the median and 104
    minutes at the 90th percentile; seven of 50 workspaces, or 14%, exceeded 90 support minutes. Paid-source
    attribution still reconciles for all 50, and no unsupported applicant entered the admitted path. Owen''s
    certified leading read remains 39 of 50 reaching first integration by day 7. Because the cohort had
