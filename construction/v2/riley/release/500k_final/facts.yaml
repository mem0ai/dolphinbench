- id: 536
  statement: 'Riley completed a proposal for one high-intent Helio Start paid-search batch. The proposal
    explicitly combines the already-certified Q2 2027 mature evidence: 18 of 25 workspaces paid-active;
    $27,860 in refund-adjusted collected cash; account-level support effort of 33 minutes at the median
    and 116 minutes at the 90th percentile; and five of 25 workspaces above 90 support minutes. Owen owns
    the cash evidence, and Customer Success owns the paid-active and account-level support evidence. The
    proposal requests no more than $8,000 and closes at the earlier of $8,000 in spend or 25 admitted
    workspaces. The proposal is based on the certified 24-case nonproduction preflight and Customer Success''s
    staffed path for no more than 25 admitted workspaces. An unsupported applicant entering the admitted
    path stops the batch; inability to reconcile paid source from eligibility-flow start through the final
    admitted, assisted, or ineligible route pauses it; and, after at least 10 admissions, more than 10%
    of admitted workspaces exceeding 90 account-level support minutes pauses it. Customer Success coverage
    is Monday through Friday from 8:00am to 6:00pm Central, with the named backup taking after-hours cases
    at the next service opening. Account-level support minutes run continuously from first contact. Existing
    eligibility, refusal, connector-access, external-authority, lifecycle, instrumentation, and assisted-routing
    rules remain unchanged. Completing the proposal does not approve a budget, the batch, paid traffic,
    or any production change. No pipeline target is authorized, the proposed batch receives no forecast
    credit or pipeline treatment, and no later additional paid batch is authorized. Paid-active status,
    refund-adjusted collected cash, and account-level support effort for the proposed fixed cohort remain
    unavailable for mature claims until that cohort has complete day-90 windows.'
  applies_when: When Priya evaluates the completed proposal for the one proposed high-intent Helio Start
    paid-search batch.
