    are deeper integration use, recent active-admin behavior by a qualifying human admin who remains currently
    active at the eligibility check, and a product-visible usage ceiling newly crossed within the prior
    14 days. Owen may refresh eligible accounts monthly, and Ines may schedule no more than three neutral,
    state-specific help-or-options exposures per week. Stale, conflicting, or deactivated-admin records
    fail closed; active Customer Success adoption or renewal work suppresses a commercial prompt; and
    Customer Success receives a handoff only after a help request or the agreed product-visible usage
    ceiling is crossed.
