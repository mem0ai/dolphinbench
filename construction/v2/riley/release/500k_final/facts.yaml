- id: 293
  statement: 'At the December 23 close, all 13 second-cohort exposures had complete 45-day windows: five
    requested help or an options review, three expanded within the window, and four of the five requests
    produced a Customer Success handoff under the agreed rule; no exposed account had active adoption
    or renewal work at exposure, and no message required correction. Across both bounded Expansion Assist
    pilots, 43 actual exposures produced 13 help or options requests and nine expansions. Current-state
    safeguards applied across both pilots, but the requirement that the product-visible usage ceiling
    have been crossed within the prior 14 days applied only to the second cohort; 18 of the first pilot''s
    30 exposures had an older ceiling event. No commercial outcome is attributed causally to the prompt,
    and without a randomized control the evidence does not establish causal lift or support forecast claims.'
  applies_when: When evaluating the operational evidence, future operating status, or commercial treatment
    of Expansion Assist after both bounded pilots.
  source_session_ids:
