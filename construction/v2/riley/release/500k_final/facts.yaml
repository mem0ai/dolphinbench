- id: 548
  statement: 'The batch followed the corrected October 13 proposal containing the complete certified Q2
    2027 mature evidence—18 of 25 workspaces paid-active, $27,860 in refund-adjusted collected cash, account-level
    support effort of 33 minutes at the median and 116 minutes at the 90th percentile, and five of 25
    workspaces above 90 support minutes—Priya''s October 16 approval, and Daniela''s November 1 launch.
    Priya remains the batch-approval owner. Owen owns the cash evidence, and Customer Success owns the
    paid-active and account-level support evidence. At launch on November 1, 2027, Daniela confirmed that
    paid-source attribution reaches each final admitted, assisted, or ineligible route, release and rollback
    controls were ready, and the Customer Success owner-and-backup rota was staffed Monday through Friday
    from 8:00am to 6:00pm Central, with the named backup taking after-hours cases at the next service
    opening, and she enabled the approved traffic. The batch was based on the certified 24-case nonproduction
    preflight and Customer Success''s staffed path for no more than 25 admitted workspaces. During the
    live batch, an unsupported applicant entering the admitted path would stop it; inability to reconcile
    paid source from eligibility-flow start through the final admitted, assisted, or ineligible route
    would pause it; and, after at least 10 admissions, more than 10% of admitted workspaces exceeding
    90 account-level support minutes would pause it. The November-December 2027 high-intent Helio Start
    paid-search batch closed on December 6, 2027 at its 25-admission cap after $7,740 in spend, before
    the $8,000 cap, and Daniela turned paid traffic off. Its 58 paid-source eligibility-flow starts finished
    in exactly three mutually exclusive final states: 25 admitted, 17 assisted, and 16 ineligible. Paid-source
    attribution reconciled through the final route for all 58 starts, no unsupported applicant entered
    the admitted path, and no lifecycle hold or suppression was bypassed. Four coordination cases used
    the staffed owner-or-backup path, with account-level support minutes retained continuously from first
    contact. The saved support monitor was evaluated after every admission from the tenth through the
    twenty-fifth and remained at or below 10% at every evaluation, so the more-than-10% support pause
    condition was never triggered. At closure, the saved support monitor showed two of 25 admitted workspaces
    above 90 account-level support minutes, or 8%. The historical Q2 2027 test had no pipeline target,
    received no forecast credit, did not authorize pipeline treatment, and did not support mature claims
    for paid-active status, refund-adjusted collected cash, or account-level support effort before its
    fixed cohort completed day-90 windows. Its existing eligibility, refusal, connector-access, external-authority,
    lifecycle, instrumentation, and assisted-routing rules remained unchanged. The closed batch has no
    pipeline target, pipeline treatment, or forecast credit; existing eligibility, refusal, connector-access,
    external-authority, lifecycle, instrumentation, and assisted-routing rules remain unchanged; and no
    additional paid batch beyond this one is authorized. Paid-active status, refund-adjusted collected
    cash, and account-level support effort for the closed batch remain unavailable for mature claims until
    all 25 admitted workspaces have complete day-90 windows.'
  applies_when: When describing, reporting, forecasting, or interpreting the historical Q2 2027 paid test;
    reporting the closed November-December 2027 paid batch; evaluating its operational evidence; or considering
    a later paid batch before all 25 admitted workspaces have complete day-90 windows.
