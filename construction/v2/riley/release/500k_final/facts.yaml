    the test at the admission cap of 25 admitted workspaces after $7,640 in spend, before the $8,000 spend
    cap; paid traffic was turned off immediately, no further workspace can enter the run, and no later
    batch is authorized. The 61 paid-source eligibility-flow starts ended in exactly three mutually exclusive
    final states: 25 admitted, 18 assisted, and 18 ineligible. Owen''s final reporting preserves separate
    counts for paid-source eligibility-flow starts, assisted routes, admissions, and attribution failures.
