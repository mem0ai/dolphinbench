  statement: 'Priya''s April 9 approval governed the one Q2 2027 Helio Start high-intent paid-search test
    with an approved budget cap of $8,000, and Daniela completed the launch check and turned on the approved
    high-intent paid-search traffic on April 12. Under that approval, the run had to close at the earlier
    of $8,000 in spend or 25 admitted workspaces, stop immediately if an unsupported applicant entered
    the admitted path, pause if paid-source attribution could not reconcile from eligibility-flow start
    through admission and assisted routing, and, after at least 10 admissions, pause if more than 10%
    of admitted workspaces exceeded 90 account-level support minutes. On May 17, Riley and Daniela closed
    the test at the admission cap of 25 admitted workspaces after $7,640 in spend, before the $8,000 spend
    cap; paid traffic was turned off immediately, no further workspace can enter the run, and no later
    batch is authorized. The 61 paid-source eligibility-flow starts ended in exactly three mutually exclusive
    final states: 25 admitted, 18 assisted, and 18 ineligible. Owen''s final reporting preserves separate
    counts for paid-source eligibility-flow starts, assisted routes, admissions, and attribution failures.
    Paid-source attribution reconciles through the final route for all 61 starts, no unsupported applicant
    entered the admitted path, and no routing or instrumentation failure required a pause. The run retained
    Ines''s existing lifecycle branches and suppression behavior, and Customer Success''s records preserve
    assisted-route reasons and account-level support minutes from first contact. At closure, the live
    support-pause monitor showed two of the 25 admitted workspaces above 90 account-level support minutes,
    or 8%, below the more-than-10% pause condition.'
  applies_when: When reporting, auditing, or interpreting the closed Q2 2027 Helio Start high-intent paid-search
    test and its fixed 25-workspace cohort, including the period before its day-90 windows matured.
