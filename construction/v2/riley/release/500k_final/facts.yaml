- id: 348
  statement: The live CS auto-nudge uses the five governed fields without adding new semantics. Daniela
    switched production CS auto-nudge decisions to the shared state feed on May 8, 2025. After June 17,
    2025, the CS auto-nudge has one production decision path through the governed shared state contract.
    A nudge can proceed only when each required field's as-of time is within its recorded freshness limit,
    external-system authority has a verified-yes state that the account or an available owner can perform
    the connector's required owner-level permission or network-allowlist action, connector authentication
    is recorded as authenticated, entitlement is recorded as active, a qualifying human admin is recorded
    as present, and no active Customer Success adoption or renewal work is recorded. Active Customer Success
    adoption or renewal work suppresses the nudge. Any stale, unresolved, or conflicting required state
    produces a visible field-specific hold. The external-system-authority field remains connector-readiness
    state and is not treated as permission for automated contact. The legacy nightly decision path is
    disabled, retained only as disabled configuration for engineering rollback, and no longer evaluates
    or releases production decisions. The retained disabled legacy configuration exposes only a feed-level
    timestamp, can preserve last-known qualifying-human-admin and Customer Success-work values when an
    individual source refresh lags, and does not show external-system-authority or connector-authentication
    state in the nudge operator view. Daniela retains engineering rollback control. Restoration requires
    either Daniela's incident rollback or Riley's customer-correction or incident-stop decision. This
