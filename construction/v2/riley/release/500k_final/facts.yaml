- id: 48
  statement: 'By Feb 28, Riley had sharpened H3 using an activation-state timing cut on the day-7 onboarding
    email: in a sample of n=210, users who activated before the onboarding touch had 3.1% churn, while
    users who were past day 7 but still pre-activation had 7.8% churn, a 4.7-point spread. Riley concluded
    the literal calendar-day-7 onboarding email was landing at the wrong time for mid-seg users and likely
    hurting already-drifting users, which motivated testing an activation-triggered onboarding send instead
    of a fixed day-7 schedule.'
