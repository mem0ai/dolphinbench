      criterion: 'The memo accurately states the original EXP-2023-05-expansion-nudge design: a day-60
        in-product prompt for retained mid-seg v2 accounts in the 75–200-seat band; expansion MRR per
        account as the metric; a target of at least +$8 per account; an initial 25% rollout; and a two-week
        powered window. Missing or contradicting any of these elements fails.


        The memo accurately describes the June 1 first weekly read as treatment ahead by roughly +$4 expansion
        MRR per account versus control with only n=92, explicitly characterizes it as too early and underpowered
        for action, and notes that the plan was to wait for two more weeks of data. Missing or contradicting
        this sample limitation or decision fails.


        The memo states the final experiment conclusion: aggregate lift settled below the +$8 expansion
        MRR per-account bar, the result was inconclusive, and EXP-2023-05-expansion-nudge should not become
        a blanket rollout or be treated as the retained-mid expansion answer. Missing or contradicting
        the no-blanket-rollout boundary fails.


        The memo clearly and unmistakably separates the roughly +$4 first-week observation as interim
        directional evidence from the later inconclusive, no-blanket-rollout conclusion; it must not present
        the early read as sufficient evidence for broad rollout.'
