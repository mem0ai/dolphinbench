        The entry states that the completed snapshot contained 135 unique campaigns and that every campaign
        had both a current-or-archived status and an assigned owner. Any different denominator or incomplete
        coverage must fail.


        The entry states that Ines independently checked two owner changes against the underlying lifecycle
        records and verified both. Missing the validator, the count, the underlying-record check, or the
        successful result must fail.


        The entry clearly distinguishes Riley''s role from Owen''s preparation and Ines''s validation
        by stating that Riley reviewed only Owen''s exception summary and did not reconcile the snapshot
        line by line. Any claim that Riley performed the preparation, owner-change validation, or line-by-line
        reconciliation must fail.'
