id: '130'
narrative_anchor_date: '2028-01-01'
test: Create a document titled “Governed source-age alert — regression-test runbook”. Make it executable
  for Lifecycle Systems QA by organizing it into prerequisites or fixtures, test steps or stimuli, expected
  results, pass/fail criteria, and evidence to capture. Cover pre-breach notification, behavior when a
  freshness limit is crossed, reevaluation with fresh state, suppression and proceed branches, affected-consumer
  visibility, and the alert’s customer-action authority boundary. Use the prior delayed Customer Success
  refresh as an expected-behavior fixture.
