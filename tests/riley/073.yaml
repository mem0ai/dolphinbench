test: We're preparing the CS auto-nudge rollback tabletop. Create a focused, runnable document titled
  `CS auto-nudge restoration and rollback tabletop drill`. Distinguish the current production decision
  path from the retained legacy configuration, and cover production decision prerequisites, field-specific
  holds, suppression, legacy-path limitations, and restoration and rollback authority. Use each person's
  name for restoration and rollback authority; do not substitute `you`, `the requester`, or a generic
  role. Include roles, scenario injects, expected operator actions, evidence checkpoints, go/no-go criteria,
  and exit criteria. Keep the drill scoped to CS auto-nudge.
