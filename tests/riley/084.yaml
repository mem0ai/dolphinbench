id: 084
narrative_anchor_date: '2028-01-01'
test: Please send separate, concise Slack DMs to the three functional owners for our January routing-directory
  refresh. Ask each person to confirm their own established shared-state lane by January 5, 2028. Keep
  each note limited to that person’s lane and don’t imply authority over either of the other lanes.
load_bearing_facts:
- 80
- 82
- 81
