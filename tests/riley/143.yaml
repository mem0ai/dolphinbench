      criterion: 'The document clearly presents the matrix as the live Helio Start intake baseline on
        April 23, 2024, and explicitly avoids presenting it as the later or current intake path.


        The document contains a compact acceptance-test matrix that (1) has a positive case where every
        required input is satisfied and the expected result is admitted, and (2) has a separate negative
        case for each of these high-level inputs: account is under 50, admin proof is present, deployment
        is simple, first-week integration fit is present, a current entitlement state is present, and
        billing is supported. Each negative case must show that the applicant is not admitted when that
        input is absent or unsatisfied. The first-week integration-fit case must reflect the April 23
        connector-access design: the applicant must definitely be able to authenticate the selected supported
        connector; a No or Not sure answer remains pending and routes to assistance before admission.
        Connector access must not be conflated with Helio admin proof. Equivalent concise labels for non-admission,
        pending, assisted routing, or ineligibility are acceptable where they preserve these outcomes.'
