id: '110'
narrative_anchor_date: '2028-01-01'
test: Create a concise two-stage reliability training note. For the June-July stage, reconcile the total
  decisions into holds and decisions that proceeded or were suppressed, then explain the hold causes and
  exactly why the pattern led to pre-breach monitoring. For the July-October stage, give the same reconciled
  totals, alert outcomes, and control failures. Include dates and draw only a control-reliability conclusion.
