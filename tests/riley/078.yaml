id: 078
narrative_anchor_date: '2028-01-01'
test: Pull the archived result for EXP-2023-02-pricing-page, then create a historical midpoint note for
  reviewers. Clearly separate what the first-week checkpoint showed, how uncertain that interim signal
  was, and what we decided about the feature flag at that point from the later powered two-week result.
  The note should prevent readers from mistaking the midpoint read for the final verdict.
load_bearing_facts:
- 342
- 343
expected_tool_calls:
- query_experiment_results
- create_doc
grade:
