  - id: rb_legacy_aggregator_retirement_exit_gate
    created_at: '2023-12-06T14:35:00-05:00'
    body: '# legacy-aggregator: mirrored-write retirement exit gate


      Status as of Dec 18, 2023: the mirrored-write validation lane has been stopped.


      What changed:

      - The final replay fixture pass was clean.

      - Live `metrics-router` references are absent.

      - Live `rollup-service` references are absent.

      - The Cardinality Guardrails fixtures cover the prior cross-service label-change
      class that made the legacy mirror feel useful after the Apr 18 label-name mismatch.

      - Validation checks that previously depended on the legacy mirror now run from
      the OTel/Prometheus path plus Cardinality Guardrails fixtures.


      Current production role:

      - `legacy-aggregator` is no longer part of the live path.

      - `legacy-aggregator` is no longer part of the mirrored validation lane.

      - `legacy-aggregator` remains only as archived legacy code.


      Do not use `legacy-aggregator` as:

      - A production rollback path.

      - An active replay source.

      - A source of live rollback criteria.


      Responder guidance:

      - Use live-path OTel/Prometheus signals for production health.

      - Use Cardinality Guardrails fixtures for the covered label-change validation
      cases.

      - If an old dashboard, annotation, doc, or runbook refers to legacy mirrored
      writes as active, treat it as stale until verified and clean or tag it clearly.


      Non-goals:

      - This does not make Cardinality Guardrails a mature or complete telemetry-governance
      program.

      - This does not turn replay or mirror movement into live-path rollback criteria.

      - This does not create a new production fallback through archived legacy code.'
    title: 'legacy-aggregator: mirrored-write retirement exit gate'
