  - id: rb_shard_keeper_rollback
    service: shard-keeper
    title: 'shard-keeper: rollback procedure (post-Apr-18 hardened path)'
    body: '1. Remove the affected replica from follower reads.

      2. Verify that the lease holder and epoch remain stable, with no acquisition
      or relinquishment events, stale-owner messages, overlapping leadership, or write
      errors.

      3. Confirm that the replica is making forward catch-up progress.

      4. Re-enter the follower read pool only after disk latency is back at baseline
      and lag is below one second for fifteen continuous minutes.

      5. Restart only if the replica stops progressing after the lease-safety checks.
      Do not use an automatic timer response as the restart condition.'
    owner: alex
    backup: cyrus_team
    created_at: '2023-05-22T16:00:00-04:00'
    last_updated: '2023-05-22T16:00:00-04:00'
    updated_at: '2025-02-06T08:40:00-05:00'
  - id: rb_metrics_router_canary
    service: metrics-router
    title: 'metrics-router: canary alert response'
    body: '# Metrics-router owner-led configuration windows


      ## Current ownership effective December 5, 2025

      - Wes is the formal metrics-router primary; Alex is the formal backup.

      - Each configuration window requires a fresh opening decision from Wes, or from
      Alex while covering for an unavailable Wes.

      - Once a window is opened, mapped operators may make single-file pushes without
      a separate approval before every safe push.

      - Retired generations must remain at four or fewer.

      - Cleanup pauses must remain at or below 100 milliseconds.

      - The full health set must return to baseline after every push.

      - Exceeding either the retired-generation or cleanup-pause threshold stops the
      window immediately.

      - After recovery, a fresh decision by Wes, or by Alex while covering for an
      unavailable Wes, permits exactly one fully observed push.

      - Opening another window requires a separate fresh decision after that push
      returns the full health set to baseline.

      - Active-generation consistency, route parity, dropped series, reload failure,
      and restart remain rollback conditions.


      ## October 7 stopped-window exercise

      The second September push changed the intended single file. Retired generations
      peaked at four and the cleanup pause was 103 milliseconds, exceeding the 100-millisecond
      ceiling, so the window stopped immediately. Full health returned seven minutes
      later, and no additional push occurred. There was no rollback condition. Wes
      correctly classified this as a stopped window, not a completed safe push or
      a reopened window.


      ## October 8 completed recovery-push exercise and acceptance

      Under the ownership rule then in force, Alex made a fresh decision authorizing
      exactly one fully observed recovery push. Wes exercised the recorded 94-millisecond
      recovery-push case. Retired generations remained at four or fewer, and the full
      health set returned to baseline. This was the single permitted recovery push
      and did not reopen a multi-push window. Hema accepted the exercised canary-response
      reference for future use by Wes and other mapped operators. The reference is
      no longer pending validation.


      ## Host-maintenance rejoin gate — April 15 clarification

      - A rejoining instance must remain isolated until it reports the current active
      generation.

      - A missing generation report does not count as healthy and does not satisfy
      the rejoin gate.

      - After the current active generation is reported, the ordinary consistency,
      parity, dropped-series, route, and health checks must all pass before canary
      isolation is released.

      - This is a host-maintenance rejoin safety check only. It does not create or
      open an owner-led configuration window or authorize a configuration push.


      ## Negative route-snapshot age: host-time anomaly versus generation mismatch

      - Isolate the affected instance when route_snapshot_age_seconds is negative.

      - Do not automatically classify a negative route-snapshot age as a route-generation
      mismatch or roll back the active configuration.

      - Check host time separately from generation evidence. Determine whether the
      instance reports the current generation and whether any route or configuration
      change occurred.

      - When the instance reports the current generation, no route or configuration
      change occurred, and the evidence is host-local, use deploy-pipeline instance
      replacement rather than configuration rollback.

      - Keep the instance isolated until it reports the current active generation
      and the ordinary consistency, parity, dropped-series, route, and full-health
      gates all pass.

      - Preserve the existing rollback conditions when the evidence actually shows
      a generation, consistency, parity, dropped-series, reload, or restart failure.

      - This guidance creates no deployment authorization or additional ownership
      change.'
    owner: wes
    backup: alex
    created_at: '2023-05-22T16:30:00-04:00'
    last_updated: '2023-06-12T15:10:00-04:00'
    updated_at: '2025-12-05T11:28:00-05:00'
  - id: rb_ingest_edge_cutover
    service: ingest-edge
    title: 'ingest-edge: cutover playbook'
    body: '## Active decoder controls — October 19–20, 2027


      Production ingest-edge enforces one request-wide 1,048,576-byte aggregate decoded-attribute
      limit across all gzip members and a 72-request decode-admission cap. Requests
      with exactly 1,048,576 decoded attribute bytes pass; requests with 1,048,577
      bytes fail before acceptance and enqueue regardless of gzip-member layout. Work
      above 72 concurrent decode admissions receives retryable pre-acceptance results,
      and no over-limit work is enqueued.


      Every accepted request must have exactly one terminal outcome. Every admission
      slot must be released exactly once after success, rejection, malformed input,
      cancellation, or disconnect. Preserve the separate 8,000-point whole-batch rule
      and the limit of eight waiting requests per tenant. Yuki retains implementation,
      release, and rollback authority for these decoder controls.


      ## PR 2519 opaque-key production behavior


      Yuki deployed PR 2519 during the January 19, 2027 production window, completing
      the production change at 10:37 AM. Yuki remained the release and rollback owner
      for this change, and no rollback occurred.


      The completed 24-hour production observation established that:

      - Caller-supplied idempotency keys remain opaque within a tenant; ingest-edge
      does not trim or lowercase them before tenant-bound lookup.

      - Every executed case variant and every executed leading-, trailing-, and repeated-whitespace
      variant remained a distinct tenant-bound idempotency identity.

      - A genuine retry using the same tenant-bound key and operation returned its
      original terminal result without another enqueue.

      - No probe showed cross-tenant replay or replay across operations.


      ## Randomized Retry-After production behavior


      The randomized one-to-three-second `Retry-After` behavior is enabled as the
      production behavior for ingest-edge. The rollout completed at 100%; do not return
      to the baseline behavior.


      ## Stop boundaries


      Stop or roll back the rollout for any of the following:

      - Any increase in 5xx responses.

      - p99 at or above 190 ms.

      - Queue depth at or above 76%.

      - Accepted-throughput loss at or above 3%.

      - Retry peaks at or above 130,000 attempts per second.


      ## Observed rollout maxima


      - 10% gate: 123,000 retry attempts per second; p99 172 ms; queue depth 74%;
      accepted throughput 2.4% below baseline; no 5xx increase.

      - 50% gate: 128,000 retry attempts per second; p99 186 ms; queue depth 75%;
      accepted throughput 2.8% below baseline; no 5xx increase.

      - 100% gate: 129,000 retry attempts per second; p99 188 ms; queue depth 75%;
      accepted throughput 2.9% below baseline; no 5xx increase.


      ## Production tenant-fair queue behavior


      - Use tenant round-robin scheduling.

      - Insert a tenant into the active ring immediately when its first request is
      queued.

      - Use eligible capacity without leaving it idle.

      - Remove a tenant from the ring when cancellation empties its queue.

      - Cap waiting requests at eight per tenant.


      Preserve the existing four-active-per-pod limit, two-active-per-tenant limit,
      bounded-decompression behavior, randomized one-to-three-second `Retry-After`
      requirement, accepted-point and dropped-point integrity checks, and restart
      checks.


      ## Service-discovery membership restoration and closure


      For a zone-imbalance response, use this bounded validation sequence:

      - Compare ready endpoints with load-balancer membership separately by zone.

      - After membership refresh, verify that traffic distribution has returned to
      baseline.

      - Confirm queue occupancy and caller errors remain at baseline.

      - Before declaring closure, reconcile every accepted request to exactly one
      caller-visible terminal result, with no duplicated or unaccounted accepted work
      and no leaked queue occupancy.


      This sequence does not change the owner map or make Alex the routine operator;
      execution remains with the mapped owner and operator paths.


      ## Tenant-burst operating check


      For this tenant-burst instance:

      - A tenant may have at most eight waiting requests.

      - Excess requests must remain retryable and fail before acceptance.

      - Every accepted request must reconcile to exactly one terminal result.

      - Other tenants and caller errors must remain at baseline.

      - An emptied queue must end at zero.


      This operator check does not transfer implementation, release, or rollback ownership
      from Yuki’s mapped path.'
    owner: alex
    backup: yuki
    created_at: '2023-03-22T09:00:00-04:00'
    last_updated: '2023-05-22T16:00:00-04:00'
