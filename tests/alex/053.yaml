  - id: rb_wes_feedback
    service: onboarding
    title: Wes feedback / mentoring runbook
    body: 'Mentor: Alex. Notes from ramp arc — May 15 staging-deploy walk-through,
      May 18 deploy-rule correction, Jun 12 Saturday canary assist, Jun 21 first solo
      overnight.


      ## Aug 16, 2023 — metrics-router load-test cardinality canary


      - Wes took first pass on a sev3 metrics-router cardinality canary during a data-platform
      load test.

      - He checked for router/deploy evidence before reaching for rollback and isolated
      the spike to an unbounded `experiment_id` label on load-test traffic.

      - He pulled Alex in within the 45-minute secondary rule when he wanted confirmation
      rather than letting the incident drift.

      - He coordinated toward stopping the load test with Cyrus''s side; the canary
      cleared without escalation or rollback.

      - Coaching note: good production judgment; keep reinforcing "find the label
      source before rolling the service" and keep the formal owner map unchanged.


      ## Aug 23, 2023 — practical operating-scope note


      - Hema and Alex reviewed Wes''s August evidence and agreed on a narrow practical
      operating-scope expansion after the Aug 16 metrics-router canary judgment.

      - Wes must continue to use the deploy pipeline rather than laptop deploys because
      laptop deploys bypass the canary.

      - Wes''s solo safe operating surface remains metrics-router non-prod and ingest-edge
      staging.

      - As of Aug 23, 2023, Wes can make first-pass production decisions for metrics-router
      canaries and staging rollback calls for ingest-edge under the deploy-pipeline
      rules.

      - Shard-keeper remains outside Wes''s solo scope unless Alex or the Cyrus-team
      backup explicitly pairs with him.

      - This is a practical operating note only and does not change the formal owner
      map.


      ## Production canary example — Nov 21, 2023


      Wes drove the daylight metrics-router sampling-window cleanup canary through
      the deploy pipeline.


      What happened:

      - A replay-validation panel twitched for several minutes after the canary slice
      went live.

      - Live metrics-router p99 stayed flat.

      - Live error rate stayed flat.

      - Dropped writes stayed at zero.

      - Rollup-service lag stayed flat.


      Good judgment shown:

      - Wes used the dashboard source labels to distinguish replay/mirror validation
      movement from live-path health.

      - He held promotion briefly instead of ignoring the twitch.

      - He verified live-path metrics and rollup-service lag before proceeding.

      - He proceeded without Alex taking over the decision.


      Scope note:

      This is Q4 evidence for first-pass metrics-router canary judgment under the
      practical backup rules. It does not change the owner map, make Wes the default
      daylight handoff, or expand his solo scope into shard-keeper.


      ## Dec 22, 2023 — daylight first-pass handoff


      After reviewing Wes''s Q4 examples, including the dashboard-source cleanup and
      the Nov 21 metrics-router canary, Hema and Alex agreed that Wes is the default
      daylight first-pass handoff for:


      - `metrics-router` canary questions.

      - `ingest-edge` staging rollback drills.


      This is under the existing deploy-pipeline rules:


      - Wes must use the deploy pipeline rather than laptop deploys; laptop deploys
      bypass the canary.

      - Wes''s solo safe surface continues to include `metrics-router` non-prod and
      `ingest-edge` staging.

      - Wes can make first-pass production decisions for `metrics-router` canaries
      and staging rollback calls for `ingest-edge` under the deploy-pipeline rules.

      - Alex no longer shadows every safe first-pass decision that falls inside this
      practical backup scope.


      Non-scope and ownership boundaries:


      - `shard-keeper` remains outside Wes''s solo scope unless Alex or the Cyrus/data-platform
      backup explicitly pairs with him.

      - The `metrics-router` and `ingest-edge` owner map does not change.

      - Wes is a genuine practical backup, but not a formal primary owner.'
    owner: alex
    backup: cyrus
