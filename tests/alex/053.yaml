  - id: rb_1707148200000
    service: ingest-edge
    title: 'ingest-edge: memory-slope canary stop rule'
    body: During a staged rollout, pause at the current cohort when memory rises monotonically
      for at least 15 minutes and queue age rises with it, even if error rate, dropped-point
      count, and duplicate-accepted count remain flat. Before another attempt, compare
      cache-key uniqueness against the prior version, inspect the allocation profile
      for an unbounded type, and confirm whether queue age stabilizes when traffic
      is held constant. If memory and queue age do not stabilize, roll back through
      the deploy pipeline before any wider promotion. Record the integrity counters
      separately; zero drops or duplicates do not make a continuing resource slope
      safe.
    created_at: '2024-02-05T10:50:00-05:00'
  - id: rb_1710794400000
    service: shard-keeper
    title: 'shard-keeper: verify lease convergence after failover'
    body: 'Process readiness alone is not the exit condition. In the staging failover
      drill, all replacement replicas reported ready after 18 seconds, but lease ownership
      did not converge until 96 seconds. Before declaring the failover complete, verify
      all of the following: 1. Every partition has exactly one owner. 2. Lease epochs
      remain monotonic. 3. No stale-owner messages appear for two full lease-renewal
      intervals. If any of those checks fail, keep the failover open and page the
      shard-keeper owner. Renewal-warning versus lease transfer: `renewal deadline
      exceeded` alone does not prove a lease transfer. Check for a changed lease epoch,
      explicit acquisition or relinquishment, overlapping leadership, and post-event
      replication convergence. If the holder and epoch remain unchanged, no overlap
      occurs, and lag returns to baseline, treat the event as a delayed renewal rather
      than a failover; do not automatically restart.


      ## Production lease-loss serving-gate invariant


      On lease-loss notification, close the old holder''s serving gate before it can
      return another routing response. The periodic poll is only a backup detector,
      not the serving-safety mechanism. Production verification must include:

      - gate closure before any later routing response

      - exactly one serving holder throughout the transfer

      - lease-loss notification to gate-close latency

      - stale routing responses

      - replacement acquisition time

      - request p99

      - errors

      - restarts


      A slow handoff or convergence warning is an availability signal to investigate
      separately. By itself, it is not evidence that the old holder served after lease
      loss or that the serving-safety invariant failed. The owner map and mapped deployment
      responsibility remain unchanged.'
    created_at: '2024-03-18T16:40:00-04:00'
    updated_at: '2024-08-14T08:25:00-04:00'
  - id: rb_1712320920010
    service: ingest-edge
    title: 'OTLP partial success: distinguish accepted from rejected points'
    body: 'When an OTLP export returns a partial-success response:


      1. Inspect the partial-success response body.

      2. Report the exact rejected data-point count and the rejection reason.

      3. State clearly that the valid portion of the export was accepted.

      4. Have the customer correct or omit only the invalid data points, then replay
      those corrected or omitted points as appropriate.

      5. Do not replay the entire original batch: data that was already accepted can
      be duplicated.

      6. Escalate if the response does not contain a rejected count or a rejection
      reason.'
    created_at: '2024-04-05T08:42:00-04:00'
  - id: rb_1732909200006
    service: otel-collector
    title: otel-collector 0.96.2-sphere.7 production checks
    body: '# otel-collector 0.96.2-sphere.7 production checks


      ## Deployment state

      - The fixed build `0.96.2-sphere.7` completed its 5% production canary on January
      8 and the authorized rolling deployment across the remaining production collector
      tier on January 15.

      - The remaining-tier rollout finished at 11:34 AM Eastern and remained under
      observation through noon.


      ## January 15 result

      - No collector crash or forwarding loop.

      - Accepted edge-gateway forwarding matched collector receipt counts.

      - Valid-request error rate was 0.01 percentage point above baseline.

      - p99 was 3 milliseconds above baseline.

      - No rollback signal fired.


      ## Response-check order

      1. Check for a collector crash or forwarding loop.

      2. Reconcile accepted edge-gateway forwarding with collector receipt counts.

      3. Compare valid-request error rate with baseline; roll back if it is more than
      0.1 percentage point above baseline for 15 minutes.

      4. Compare p99 with baseline; roll back if it is more than 20 milliseconds above
      baseline for 15 minutes.

      5. Treat intentionally rejected malformed requests as expected only after the
      valid-traffic and accounting checks remain clean.'
    created_at: '2024-11-29T14:40:00-05:00'
