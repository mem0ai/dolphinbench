  - id: rb_1697635080004
    service: metrics-router
    title: 'Cardinality Guardrails: label-change preflight first cut'
    body: "# Cardinality Guardrails: label-change preflight first cut\n\nThis entry
      records the first acceptance-check pass for the Q4 Cardinality Guardrails work.
      It is not a mature program, a general telemetry rewrite, a customer-facing surface,
      or a legacy-aggregator retirement plan.\n\n## Reviewer checklist\n\n### 1. Scope
      the change\nPass if the PR says whether it touches metrics-router, shard-keeper,
      rollup-service, or a cross-service label boundary.\nFail if the PR changes label
      names or label value shapes without naming the affected service boundary.\n\n###
      2. New label keys or changed value shapes\nPass if every new label key or changed
      value shape names an owner, source, expected cardinality shape, and whether
      it is live-path or validation-only.\nFail if a new label can appear on live
      metrics-router or shard-keeper traffic without an owner and expected cardinality
      shape.\n\n### 3. Risky label families\n- `customer_id`: high-cardinality by
      nature, but expected and already budgeted when owner/source are clear. Do not
      fail solely because this label is high-cardinality.\n- `experiment_id`: fail
      live router pushes unless new experiment labels are explicitly allowed and bounded.\n-
      `route_pattern`: pass only when values are normalized route patterns; fail raw
      IDs or raw paths.\n- `deployment_sha`: okay for canary visibility; fail noisy
      joins with per-request labels.\n- `error_detail`: fail as a metrics label family.
      Raw error strings or payload fragments should not become metric labels.\n\n###
      4. Sample distinct counts before promotion\nPass if the reviewer can see sample
      distinct counts from realistic traffic for new or changed label value shapes.\nFail
      if the only evidence is a hand-wavy assertion that the canary is green.\n\n###
      5. Rollup-service parity before cross-service label-name changes\nPass if rollup-service
      expects the same label name and semantics before a label-name change crosses
      service boundaries.\nFail if metrics-router or shard-keeper ships a label-name
      change that downstream rollup-service consumers do not recognize.\n\n### 6.
      Alert-source and rollback semantics\nPass if dashboards and alert text distinguish
      live metrics-router traffic from replay or mirror validation samples.\nLive-path
      movement can start rollback discussion.\nReplay or mirror validation movement
      is investigation evidence and Q4 controls input, not rollback criteria.\nFail
      if replay or mirror movement is described as a live rollback trigger.\n\n##
      Ownership and non-goals\n\nService-level enforcement tradeoffs stay with Alex's
      side of the metrics pipeline. Cyrus and data platform can provide cost examples
      and validate cost intuition, but they do not own router or shard enforcement
      gates.\n\nNon-goals: no customer-facing dashboard, no release-readiness score,
      no broad telemetry rewrite, no legacy-aggregator retirement claim, no default
      ownership change for enforcement, and no claim that Cardinality Guardrails is
      complete.\n\n## First-use review notes — Nov 8, 2023\n\nThese notes clarify
      how to apply the first-cut checklist. They do not make Cardinality Guardrails
      mature, complete, or a general telemetry rewrite.\n\n- Local metrics-router
      visibility labels: require owner, source, expected cardinality shape, and evidence
      from live canary traffic or a representative live-path fixture when the value
      shape can change on the hot path. Rollup-service signoff is not required for
      labels that do not cross a service boundary.\n- Cross-service label names or
      meaning changes: require rollup-service parity before promotion. A green metrics-router
      canary does not substitute for downstream consumers expecting the same label
      name and semantics.\n- `route_pattern`: pass only for normalized route patterns.
      If a code path could emit raw account IDs, widget IDs, or raw paths on live
      traffic, reviewers need live-path evidence or a representative live-path fixture;
      replay validation alone is not enough.\n- Replay or mirror validation panels:
      keep them visible as investigation evidence. Do not describe replay or mirror
      movement as live rollback criteria.\n- Cost examples: keep them directional
      and advisory. Cyrus/data platform can validate cost intuition, but enforcement
      gates stay with the service owners.\n\n## Pilot prevention note — Nov 14, 2023\n\nThe
      first concrete prevention case for this first-cut checklist came from a rollup-service
      validation metrics proposal.\n\nProposed shape that did not ship:\n`rollup_validation_sample_total{validation_result=\"match|mismatch\",
      replay_source_id=\"$source_id\"}`\n\nWhy it failed the checklist:\n- `replay_source_id`
      is a raw replay-stream identifier.\n- Cyrus's sample showed the value is effectively
      unbounded across replay sources, jobs, chunks, and backfills.\n- The debugging
      need was real, but the raw identifier belongs in logs rather than as a metrics
      label.\n\nAccepted shape:\n- Keep raw `replay_source_id` in logs for debugging.\n-
      Use a bounded `source_class` metric label for rollup-service validation dashboards.\n-
      Preserve validation visibility without introducing an unbounded label into the
      metrics pipeline.\n\nThis is evidence that the first-cut Cardinality Guardrails
      review can prevent a bad label shape without blocking the debugging need. It
      does not make Cardinality Guardrails mature, complete, or a general telemetry
      rewrite.\n\n## Raw identifier labels — first-cut guidance\n\nRaw identifiers
      are not automatically forbidden as metric labels, but they need an explicit
      value-shape check before review treats them as safe.\n\nUse the checklist questions:\n-
      Is the value set bounded and named, or can it grow with requests, jobs, tenants,
      chunks, backfills, or arbitrary source records?\n- Does the dashboard or alerting
      use case require this as a metric dimension, or is the raw identifier only needed
      for debugging?\n- If the raw identifier is effectively unbounded, keep it in
      logs or trace context instead of the metrics label set.\n- If dashboard grouping
      is required, prefer a bounded classification label such as `source_class` or
      another reviewed enum.\n\nThis is first-cut Cardinality Guardrails review guidance.
      It is not a blanket rule that all IDs are forbidden, it is not a general telemetry
      rewrite, and it does not make Wes the default enforcement owner.\n\n## Required
      operating rule — narrow label-change class\n\nFor production review after Dec
      12, 2023, label changes that touch `metrics-router`, `shard-keeper`, or `rollup-service`
      must run the Cardinality Guardrails checks below before the change is treated
      as safe for production review.\n\nRequired checks:\n1. Label-cardinality preflight.\n
      \  - Identify new or changed label keys and changed value-shape behavior.\n
      \  - Show whether the value set is bounded, expected high-cardinality with an
      owner/budget, or effectively unbounded.\n   - Use live canary evidence or a
      representative live-path fixture for live-path value-shape changes; replay evidence
      alone is not enough for a live-path label change.\n   - Keep unbounded raw identifiers
      in logs or trace context unless a reviewed bounded metric dimension is justified.\n\n2.
      Alert-source classification check.\n   - Classify whether the relevant panel
      or alert signal is live-path, replay-source, mirror-source, or other validation-source
      evidence.\n   - Replay or mirror movement can remain visible as investigation
      evidence, but it is not rollback criteria by itself.\n   - Reviewers must not
      allow validation-source panels to read like live rollback triggers.\n\nReview
      path:\n- Nadia keeps alert semantics in the Cardinality Guardrails review path.\n-
      Cyrus keeps the cost/cardinality angle attached to review.\n- Rollup-service
      ownership remains with the Cyrus/data-platform side; this rule does not move
      enforcement ownership to data platform.\n\nNon-goals:\n- This is not a mature
      or complete Cardinality Guardrails program.\n- This is not a general telemetry
      rewrite.\n- This does not make Wes or any practical backup the default enforcement
      owner.\n\n## Completed production example — deployment.environment\n\nThe mapped
      service owners completed the `deployment.environment` rollout through the production
      OTel ingestion, metrics-router, and rollup-service path after the required label-cardinality
      preflight and alert-source classification check.\n\n- Mixed-case allowed inputs
      normalize only to `prod`, `staging`, or `dev`.\n- Absent input produces no `deployment.environment`
      label.\n- `qa`, unknown, malformed, and arbitrary raw values are rejected before
      publication and create no series.\n- Tenant distinct values cannot exceed three.\n-
      The forty-eight-hour production observation found no rollup-service producer-consumer
      mismatch.\n- Implementation and operational ownership remain with the mapped
      service owners; Alex is not the catch-all implementer or operator for the change."
    created_at: '2023-10-18T09:18:00-04:00'
