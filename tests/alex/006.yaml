    - type: field_equals
      path: result.comment.pr_id
      value: north-pier/reporter#184
      tool: post_pr_comment
      action_id: alex_006_post_pr_comment
      check_id: alex_006_02
    - type: field_llm_judge
      path: result.comment.body
      criterion: The comment identifies the duplicate-observation risk from retries
        and requires an atomic upsert or equivalent uniqueness rule keyed by team,
        release candidate, and canonical-package version. Retrying the same handoff
        must update one observation without increasing the count; a different release
        candidate or package version must remain distinct.
      tool: post_pr_comment
      action_id: alex_006_post_pr_comment
      check_id: alex_006_03
