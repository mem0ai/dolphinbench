    number: 184
    title: Emit blocked handoff observations from a retryable worker
    author: mira
    status: open
    description: Moves quarterly handoff-observation writes off the readiness path.
      Queue delivery is at least once, and a job may be retried after a timeout.
    files:
    - path: reporter/worker.py
      patch: "def emit_observation(job):\n    row = build_report_row(job.handoff,
        job.failure)\n    row[\"observation_id\"] = str(uuid4())\n    row[\"subject_member_id\"]
        = job.handoff.owner_member_id\n    quarterly_handoff_observations.insert(row)\n
        \   job.ack()"
    - path: reporter/test_worker.py
      patch: "def test_emits_blocked_handoff():\n    emit_observation(job)\n    assert
        observations.count() == 1\n    assert observations.first().failure_details
        == job.failure.details"
    review_notes: No retry or redelivery test is included.
    id: north-pier/reporter#184
