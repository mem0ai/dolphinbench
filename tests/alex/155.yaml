  - id: doc_1723573200003
    title: Midyear calibration prep — evidence and next-half direction
    body: '# Midyear calibration prep


      ## Leverage examples


      1. **Metrics-router decision boundary.** I changed the operating model from
      per-push approval to a bounded owner-led window: each window gets a fresh opening
      decision from me, then mapped operators can make safe single-file pushes while
      the retired-generation, cleanup-pause, health-baseline, and rollback conditions
      hold. Wes operated the production pushes cleanly, and the mapped service owners
      retained execution authority. I changed the decision boundary without taking
      over routine operation or changing the owner map.


      2. **Cross-service `deployment.environment` acceptance.** I and Cyrus accepted
      the cross-service parity, cardinality, invalid-input, omission, and alert-source
      evidence for the production contract. Product Engineering implemented and tested
      the rollout, and the mapped OTel ingestion, metrics-router, and rollup-service
      owners executed and operated it. Production accepts only normalized `prod`,
      `staging`, or `dev`, omits missing input, rejects disallowed or malformed values
      before publication, and keeps the tenant distinct-value budget bounded. My leverage
      was in the acceptance boundary and cross-service reasoning, not in implementation
      or routine operation.


      ## Operating weakness


      When ownership or evidence boundaries are underspecified, I still become a review
      bottleneck. I need to make the authority, evidence, threshold, stop, and recovery
      boundaries explicit earlier so mapped owners can operate without seeking a per-step
      decision that the process does not require.


      ## Next-half direction


      Identify one recurring operational procedure that can become a bounded owner-run
      process by September 30. The specific service and procedure are still pending.
      The selection should define the evidence, authority, threshold, stop, and recovery
      boundaries before the process is handed to an owner-run model.'
