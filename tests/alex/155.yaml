  - id: doc_1790263920000
    title: Lantern continuation and platform-boundary decision — September 24, 2026
    body: '# Decision


      On September 24, 2026, Hema and Theo authorized Harbor Health and Mosaic Commerce,
      and no other accounts, to continue from October 1, 2026 through March 31, 2027
      with read-only access through the shared authorization wrapper. The renewed
      term does not activate before October 1.


      # Permitted customer scope


      Access remains limited to:

      - provenance-backed deploy movement;

      - published service ownership;

      - timestamped incident-load summaries; and

      - explicit unknown states.


      No additional account, cost data, CSV export, raw incident text, internal room
      metadata, employee identifier or comparison, inferred or unpublished ownership,
      internal-only fallback data, write capability, release-readiness judgment, or
      employee-performance interpretation is authorized.


      # Suspension conditions


      An authorization-wrapper bypass, adapter call after denial, cross-tenant material,
      stale or missing source rendered as anything other than explicit unknown, deploy
      event without required provenance, unpublished ownership, incident-load summary
      without its source timestamp, exposure of an excluded field, or loss of read-only
      enforcement immediately suspends both accounts pending correction and a successful
      rerun of the affected safety check. Latency and other errors do not independently
      suspend access unless they cause one of those violations.


      # Internal platform cycle


      Hema accepted the reference-only model as the starting point for an internal
      platform cycle beginning October 1, 2026. The cycle does not begin early. Lantern
      remains the explanation layer, Cardinality Guardrails remains the authority
      for pipeline limits and cost signals, and the owner map remains the authority
      for published responsibility.


      # Reference contract


      The shared integration uses canonical published service identity and exactly:

      - `tenant_id`

      - `canonical_service_id`

      - `authority_type`

      - `authority_record_id`

      - `source_timestamp`


      The integration carries no copied authority payload and provides no writeback
      or mutation capability.


      # Ownership


      - Alex owns the shared contract and failure-mode boundaries.

      - Iris owns interpretation and adoption criteria.

      - Cyrus owns the Cardinality Guardrails authority interface and cost semantics.

      - Wes owns metrics-router control mappings and operating evidence.

      - Product Engineering owns Lantern implementation.


      # Customer-exposure boundary


      Customer exposure of the reference-only integration requires separate later
      authorization. This decision does not activate either the renewed customer term
      or the internal platform cycle before October 1.


      ## October 1, 2026 — internal platform-cycle operating handoff


      - Repository reviewer routing is corrected: Alex is required only for changes
      touching tenant isolation, provenance or authoritative source timestamps, authority
      duplication or mutation behavior, or customer-path isolation. Routine copy,
      fixture naming, and implementation work proceeds through Product Engineering''s
      mapped reviewers.

      - The first internal implementation slice may attach separate read-only owner-map
      and Cardinality Guardrails references to the same canonical service. Each reference
      preserves its own `authority_type`, `authority_record_id`, and `source_timestamp`.

      - This records the first-slice design only. It does not claim implementation
      completion or internal-shadow approval.

      - No reference output may enter the Harbor Health or Mosaic Commerce customer
      paths without separate later authorization.


      ## November 12, 2026 — dual-authority correction and bounded internal-shadow
      addendum


      Product Engineering delivered the corrected staff-only build for PR 1226. Across
      120 fixture runs—60 Harbor Health-shaped and 60 Mosaic Commerce-shaped—all 24
      dual-authority cases preserved separate owner-map and Cardinality Guardrails
      references in both insertion orders. Each reference is keyed by `tenant_id`,
      `canonical_service_id`, `authority_type`, and `authority_record_id` and retains
      its own `source_timestamp`. Twelve stale or missing authority records rendered
      explicit unknown, and eight denied requests made zero adapter calls. No run
      crossed tenants, dropped required provenance or a source timestamp, copied an
      authority payload value, exposed a mutation path, or created a request or artifact
      in either customer path.


      The order-dependent overwrite block is closed. Alex closed the triggered contract
      review, and the corrected build is admitted to bounded internal shadow for Infra
      and Product Engineering. Lantern still copies no authority values and provides
      no mutation capability. The reference-only integration remains absent from Harbor
      Health and Mosaic Commerce. This addendum does not approve customer exposure
      or graduate the build to continuing internal operating use.'
