  - id: doc_1736865000013
    title: Oversized-batch design and staged enablement — through January 28
    body: '# Oversized-batch design and staged enablement


      ## Selected permanent behavior

      - Participating SDKs reject batches above 8,000 points before transmission.

      - The local error tells callers to split the batch before retrying.

      - Ingest-edge retains a deterministic backstop for older or nonconforming clients.

      - The backstop returns HTTP 413, accepts zero points, reports rejected points
      equal to the submitted count, and uses the machine-readable `oversized_batch`
      reason.

      - Clients must not retry an unchanged oversized request.


      ## Evidence behind the decision

      - Current SDK clients rejected oversized attempts locally without network transmission.

      - Split compliant requests reconciled accepted-point accounting.

      - The older client received the deterministic ingest-edge response, made no
      unchanged retry, and succeeded after splitting.

      - The corrected SDK error text names the 8,000-point maximum and the split-before-retry
      action.


      ## Enablement window

      Stage enablement through January 28, with participating SDK prevention first
      and ingest-edge retained as the server-side backstop.


      ## Verification and stop checks

      - No unchanged retry after local rejection or HTTP 413.

      - Accepted plus rejected points reconcile to submitted points.

      - Split requests do not duplicate or lose points.

      - Compliant traffic remains at baseline error and latency levels.


      The design is selected; this document does not claim staged enablement is complete.'
    folder: Eng
    created_at: '2025-01-14T09:30:00-05:00'
  - id: doc_1739376120000
    title: Lantern pilot — March 10 preparation and stop conditions
    body: '## Authorized cohort and timing


      - Harbor Health and Mosaic Commerce are the only accounts authorized for this
      pilot.

      - The pilot is read-only and runs for 30 days beginning March 10, 2025.

      - Customer access remains closed until March 10. Access for every other customer
      remains closed.


      ## Required lookup path and permitted output


      - Every lookup must use the shared authorization wrapper.

      - Permitted output is limited to provenance-backed deploy events, published
      service ownership, incident-load summaries with source timestamps, and explicit
      unknown states when data is absent.


      ## Automatic technical stop conditions


      Immediately suspend all pilot access for any of the following:


      - authorization-wrapper bypass;

      - any adapter call after a denial;

      - any cross-tenant material;

      - any stale or missing source rendered as something other than explicit unknown;

      - any deploy event without required provenance;

      - any unpublished ownership;

      - any incident-load summary without its source timestamp;

      - exposure of raw incident text;

      - exposure of internal room metadata;

      - individual comparisons;

      - inferred ownership;

      - fallback to internal-only metadata;

      - loss of read-only enforcement.


      After a stop, access remains suspended until the issue is corrected and the
      affected safety check reruns successfully. Latency and other error signals remain
      monitored but are not independent automatic stops unless they cause one of the
      listed violations.'
