    title: legacy-aggregator live-path isolation inventory — Jul 18
    body: 'Audience: Hema, infra/platform, data platform.


      Remaining references from today''s trace:

      - legacy-aggregator is still receiving mirrored writes.

      - legacy-aggregator is still feeding the replay validator.

      - It no longer needs to participate in live metrics-router routing if the last
      fallback path is cut cleanly.

      - It no longer needs to participate in live rollup-service routing if the last
      fallback path is cut cleanly.


      Immediate target:

      - Isolate legacy-aggregator from the live production path while leaving mirrored
      writes and replay validation intact.


      Non-goals:

      - Full retirement is separate future work after validation is safe.

      - Do not turn this into a named Q3 cardinality-control project.


      Risks / readiness:

      - The remaining live dependency is the last fallback path; that cut has to be
      clean.

      - Do not remove mirrored writes yet.

      - Do not remove replay validation yet.


      Next steps:

      1. Identify and delete or gate the last live fallback route.

      2. Confirm metrics-router no longer has a live dependency on legacy-aggregator.

      3. Confirm rollup-service no longer has a live dependency on legacy-aggregator.

      4. Keep mirrored writes and replay validator running for comparison until full
      retirement is safe.

      5. Bring Hema a small risk/readiness read before cutting the fallback.'
