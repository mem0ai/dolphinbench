  - id: doc_1811950500009
    title: Infrastructure systems-design interview scorecard
    body: '# Infrastructure systems-design interview scorecard


      ## December 7, 2027 debrief-aligned assessment


      Record observable reasoning and evidence rather than confidence, style, or candidate-identifying
      information. Alex’s technical evaluation is not the hiring decision.


      ## Rating rule

      - **Pass:** The candidate states the boundary clearly and supports it with executable
      or directly observable evidence.

      - **Mixed:** The candidate reaches part of the boundary, needs prompting, or
      offers incomplete evidence.

      - **Fail:** The candidate permits unsafe behavior, cannot state the boundary,
      or substitutes an unsupported claim for evidence.


      ## 1. Tenant-safe pre-acceptance admission — Pass

      The candidate placed tenant limits before acceptance, kept excess work retryable,
      and preserved one accepted-work identity. This directly demonstrated a tenant-safe
      admission boundary rather than relying on a later correction.


      ## 2. Fail-before-readiness behavior — Pass

      The candidate kept replacement readiness closed until immutable configuration
      and derived routing state agreed. The demonstrated design fails closed instead
      of allowing mixed state to serve.


      ## 3. Executable crash or retry recovery evidence — Mixed

      The candidate described a sound journal-and-replay design but supplied tabletop
      reasoning rather than an executable crash or reconnect test. After prompting,
      the candidate identified the exact harness needed. The design is credible, but
      the recovery claim remains unexecuted and should not be scored as demonstrated
      recovery evidence.


      ## 4. Technical recommendation versus mapped-owner decisions — Pass

      The candidate clearly separated technical recommendations from mapped-owner
      implementation, release, and rollback decisions. No routine owner decision was
      centralized in the reviewer role.


      ## Overall assessment — Mixed-positive

      Strong on tenant-safe admission, fail-before-readiness behavior, and ownership
      boundaries. Evidence discipline is mixed: the recovery design was sound and
      the needed harness was identified, but the crash or reconnect behavior was not
      executed. The assessment therefore distinguishes demonstrated boundaries from
      the remaining unexecuted recovery claim.


      ## Submission status

      Debrief-aligned draft completed. Alex must personally review and submit the
      scorecard.


      ## Archived June 9, 2027 technical evidence

      - Invariant definition: 4/4. The candidate defined an exactly-one-serving-generation
      invariant before choosing an implementation.

      - Serving-readiness reasoning: 4/4. The candidate kept replacements unready
      until the manifest, immutable snapshot, and restored route index agreed.

      - Accepted-work terminal accounting: 4/4. The candidate accounted every accepted
      request to exactly one terminal outcome.

      - Ownership boundaries: 3/4. The candidate assigned implementation and rollback
      to mapped owners after prompting redirected an initial centralized-approval
      proposal toward triggered boundary review.


      The archived ratings are technical observations only and do not constitute a
      hiring decision.'
