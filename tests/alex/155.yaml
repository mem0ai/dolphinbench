  - id: doc_1714572600013
    title: Staff calibration review prep — May 7
    body: '# Operating problem


      Show how recurring cross-service and data-contract risks can be handled with
      explicit checks and escalation boundaries instead of relying on one person to
      review every case. The goal is reusable technical operating leverage, not a
      transfer of formal ownership or people management.


      # Reusable mechanisms


      - For covered Cardinality Guardrails changes, require an executable parity fixture
      and affected-owner signoff, alongside the relevant cardinality and alert-source
      checks, before production review.

      - For Lantern, keep the ordinary admission lane with Iris while defining a clear
      exception boundary for escalated data-contract issues that need deeper schema,
      provenance, access, or downstream-semantics review.

      - Use bounded first-pass checks so routine operational decisions can move through
      an established mechanism without turning Alex into the standing reviewer.


      # Explicit ownership boundaries


      These mechanisms improve how owners operate; they do not make Alex the owner
      of every covered review or every Lantern room. Iris retains ordinary Lantern
      admission decisions. Wes performs bounded first-pass checks within his practical
      scope, without Alex managing him or the formal owner map changing. Cross-service
      checks still require the affected owners and the appropriate service boundaries.


      # Discussion examples


      1. **Guardrails parity-and-owner-signoff gate.** A covered cross-service label
      change is not treated as safe merely because one service''s tests pass. The
      executable parity fixture, affected-owner signoff, cardinality check, and alert-source
      check make the downstream contract visible before production review.


      2. **Lantern ordinary lane versus exception boundary.** Iris can handle an ordinary
      admission decision. When a data-contract exception changes the meaning or safety
      of downstream data, it moves through the explicit exception boundary for focused
      technical review rather than silently being normalized in the ordinary lane.


      **Status note:** Wes performs bounded first-pass checks; Alex does not manage
      him. The formal Staff IC calibration remains underway, and no Staff title is
      effective.'
    folder: null
    created_at: '2024-05-01T10:10:00-04:00'
  - id: doc_1715003220000
    title: Lantern customer preview — external contract v0
    body: '# Lantern customer preview — external contract v0


      > **Boundary:** This document defines a customer-safe contract only. It grants
      no customer access, does not copy the internal Lantern UI, exposes no raw internal
      discussion or internal permission identifiers, and is not an employee-performance
      or manager-readiness surface.


      ## Audience and non-goals


      Define the intended customer audience and the operational questions the preview
      may answer. Record explicit non-goals, including customer access before the
      contract is reviewed, exposure of internal discussions or permission identifiers,
      employee-level operational signals, manager-readiness interpretation, and copying
      the internal UI.


      ## Tenant authorization


      Specify how tenant authorization is evaluated, what tenant boundary is checked,
      and how unauthorized access is represented.


      ## External fields


      ### Deploy movement


      Define the externally stable deployment identifier, service, environment, state
      transition, and customer-visible timestamp. Exclude internal actor IDs, chat
      links, and raw pipeline job identifiers.


      ### Service ownership


      Define the service-facing support or escalation label. Exclude employee names
      and internal owner-map records.


      ### Incident load


      Define the customer-safe operational summary, including its time window, aggregation
      rules, minimum threshold, and treatment of suppressed, stale, missing, delayed,
      and unavailable data.


      ## External provenance


      Define which provenance information can be exposed externally without revealing
      internal identifiers, discussions, or permission references.


      ## Data-state semantics


      Define distinct states for `unknown`, `not applicable`, `not authorized`, `temporarily
      unavailable`, stale data, delayed data, missing data, and intentionally suppressed
      data. Do not collapse materially different states to null.


      ## Error envelope


      Define the response-level error shape, including permission denial and other
      errors that apply to the response rather than a single field.


      ## Worked examples


      Add representative success, suppressed, stale, unavailable, and permission-denied
      examples after the field-level decisions are reviewed.


      ## Unresolved questions


      Record policy questions that require product or engineering review rather than
      hiding them in UI behavior.


      ## Review status


      This is contract work only. No customer access is authorized until the external
      fields, authorization, provenance, failure semantics, examples, non-goals, and
      unresolved questions have been reviewed.'
    folder: null
    created_at: '2024-05-06T09:47:00-04:00'
