  - id: doc_1805390280006
    title: Authority-record time semantics — March 18 brown-bag
    body: '# Authority-record time semantics — March 18 brown-bag


      ## Authoritative source time

      `source_timestamp` represents the original authoritative time of the underlying
      authority record. Later observation, serialization, processing, retry, and navigation
      times may be recorded as separate metadata, but they must not replace or refresh
      `source_timestamp`.


      ## Fail-closed behavior

      If a required source timestamp is missing or malformed, downstream navigation
      fails closed to explicit unknown.


      ## Multiple authority references

      When one card carries multiple authority references, each reference retains
      its own `source_timestamp`. An envelope time, render time, processing time,
      or newest retry time must not be substituted for any reference''s authoritative
      source time.


      ## Unchanged boundaries

      This discussion creates no ownership, implementation, release, approval, or
      customer-authorization change. The internal reference-only integration remains
      outside the Harbor Health and Mosaic Commerce customer paths.'
    folder: Eng
    created_at: '2027-03-18T13:18:00-04:00'
  - id: doc_1805990700006
    title: Lantern customer access renewal — March 25, 2027
    body: '# Lantern customer access renewal — March 25, 2027


      ## Final decision

      The March 25 continuation review is complete. Hema and Theo authorized Harbor
      Health and Mosaic Commerce, and no other account, to continue with bounded read-only
      Lantern access from April 1 through September 30, 2027.


      ## Effective-date boundary

      The existing authorization remains unchanged through March 31, 2027. The renewed
      term begins April 1 and does not take effect early.


      ## Authorized lookup path and read-only surface

      Every Harbor Health and Mosaic Commerce lookup remains behind the shared authorization
      wrapper. The permitted customer surface is limited to:

      - provenance-backed deploy movement;

      - published service ownership;

      - timestamped incident-load summaries; and

      - explicit unknown states.


      ## Complete exclusions

      The renewed term does not authorize:

      - any additional customer account;

      - cost data;

      - CSV export;

      - raw incident text;

      - internal room metadata;

      - employee identifiers or comparisons;

      - inferred or unpublished ownership;

      - internal-only fallback data;

      - write capability or writeback;

      - release-readiness judgments;

      - employee-performance interpretations; or

      - customer exposure of the internal owner-map/Cardinality Guardrails reference
      navigation.


      ## Internal reference-only integration

      The owner-map/Cardinality Guardrails reference-only integration remains an internal
      navigation mechanism and stays outside the Harbor Health and Mosaic Commerce
      customer surface. It is not included in this renewal.


      ## Automatic suspension conditions

      Either of the following violations immediately suspends both accounts pending
      correction and a successful rerun of the affected safety check:

      - an authorization-wrapper bypass;

      - an adapter call after denial;

      - cross-tenant material;

      - stale or missing input rendered as anything other than explicit unknown;

      - a deploy event without required provenance;

      - unpublished ownership;

      - an incident-load summary without its source timestamp;

      - exposure of any excluded field; or

      - loss of read-only enforcement.


      Latency and other errors do not independently suspend access unless they cause
      one of the listed violations.


      ## Term close

      This record governs the Harbor Health and Mosaic Commerce authorization through
      September 30, 2027. It grants no access to any other account and does not expand
      the authorized data or capability surface.'
