  - id: doc_1822000800003
    title: October 27, 2027 facilitator packet
    body: '# October 27, 2027 facilitator packet


      ## Example 1 — separate reassessment time from entry time


      ### What happened

      A reassessment was completed at 16:55, and the entry documenting it was made
      at 17:40.


      ### Safe wording

      “Late entry entered at 17:40 for a reassessment performed at 16:55. This entry
      records the findings from the 16:55 reassessment and does not alter the earlier
      record.”


      ### What the wording must not imply

      That the entry existed at 16:55, that documentation time was changed to match
      the reassessment time, or that an earlier entry was replaced.


      ## Example 2 — addendum preserving the original record


      ### What happened

      A later review found that the original entry omitted a clarification. The original
      entry remains visible, and an addendum is entered at 18:10.


      ### Safe wording

      “Addendum entered at 18:10: [clarification]. This addendum supplements the original
      entry; it does not replace or backdate it.”


      ### What the wording must not imply

      That the original entry was changed or deleted, that the addendum existed before
      18:10, or that the underlying care necessarily occurred at 18:10.


      ## Final submission check

      - Submit one fully anonymized document by October 15, 2027.

      - Confirm the title identifies the October 27, 2027 session and that neither
      the title nor body contains patient identifiers.

      - Keep exactly these three categories under each example: What happened; Safe
      wording; What the wording must not imply.

      - Add no patient-specific clinical detail.

      - Confirm the addendum preserves the original record: the original remains visible,
      and the addendum supplements rather than replaces or backdates it.

      - Devika reviews the complete packet and personally submits it to the hospital.'
    folder: null
    created_at: '2027-09-26T19:20:00-04:00'
