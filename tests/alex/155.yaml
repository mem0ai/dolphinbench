  - id: doc_1720444200000
    title: Lantern remaining readiness suite — July 12 execution plan
    body: "# Lantern remaining readiness suite — July 12 execution plan\n\n## Scope
      and access boundary\n\nThis is the remaining internal readiness run for the
      Lantern customer preview. The access state is internal only; no customer access
      is granted by this run. Passing individual cases does not itself grant customer
      access.\n\n## Fixture groups and response-content assertions\n\n1. **Fresh permitted
      incident source**\n   - Expect the service identifier, window, incident count,
      active minutes, and source timestamp.\n   - The rendered object must not contain
      raw incident references, room names, employee identifiers, or individual comparisons.\n\n2.
      **Absent permitted source**\n   - Return an explicit unknown.\n   - Do not infer
      values or use an internal fallback.\n\n3. **Stale permitted source**\n   - Return
      an explicit unknown with the source state represented.\n   - Do not return counts
      or active minutes, and do not use an internal fallback.\n\n4. **Malformed permitted
      source**\n   - Return an explicit unknown.\n   - No protected fields may enter
      the rendered object.\n\n5. **Unauthorized request for each lookup type**\n   -
      Return `403 not_authorized`.\n   - Authorization must complete before any source
      adapter is invoked.\n\n## Evidence requirements\n\nCapture the external response
      for every case, the adapter-call trace, the source timestamp where applicable,
      and proof that forbidden fields do not enter the rendered object.\n\nKeep response-content
      assertions separate from call-order evidence. A response that contains no protected
      value is not sufficient to pass an unauthorized case if a source adapter was
      invoked before authorization completed.\n\n## Gate interpretation\n\nThis suite
      is an internal readiness check. Passing individual cases does not itself grant
      customer access; the preview remains internal unless the applicable readiness
      and access decision is made separately."
