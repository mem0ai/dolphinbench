  - id: doc_1718292000030
    title: Cross-service gate exceptions — June 14 review
    body: '# Cross-service gate exceptions — June 14 review


      I define cross-service gates and escalation boundaries; I do not take over routine
      service operation or Iris''s product interpretation.


      ## 1. Metrics-router generation-retirement thresholds


      - **Invariant:** Pause additional configuration pushes if retired objects accumulate
      above four or cleanup pauses exceed 100 milliseconds. Preserve rollback for
      active-generation inconsistency, route divergence, or dropped series.

      - **Observed evidence:** A single-file canary reached four retired generations
      and a 92-millisecond cleanup pause; the values approached but did not cross
      the thresholds, and the other consistency, parity, drop, reload, heap, and restart
      checks remained clean.

      - **Current exception or uncertainty:** The event is near the pause boundaries;
      it does not establish that later pushes are safe without observation.

      - **Mapped owner:** Metrics-router service ownership remains with the mapped
      service owner; Wes is the practical first-pass backup within the existing deploy
      rules.

      - **Decision needed:** Whether the next configuration push may proceed one at
      a time.

      - **Escalation condition:** Cross more than four retired objects or 100 milliseconds
      of cleanup pause, or observe active-generation inconsistency, route divergence,
      or dropped series.


      ## 2. Ingest-edge bounded decompression


      - **Invariant:** Keep active decompression bounded at four per pod and two per
      tenant; preserve permit cleanup, body limits, accepted-point integrity, request-p99
      rollback gates, and randomized one-, two-, and three-second Retry-After behavior.

      - **Observed evidence:** Request p99 briefly rose 19 milliseconds above baseline;
      decode-wait p99 reached 188 milliseconds, waiting work reached eleven on the
      busiest pods, and one tenant represented 64% of queued requests. Active work
      stayed within the per-pod and per-tenant limits, permits returned to zero, oversized
      bodies were rejected before over-budget append, no accepted points were dropped,
      and no pod restarted.

      - **Current exception or uncertainty:** The concentrated waiting queue raises
      a separate fairness and capacity question even though no rollback gate fired.

      - **Mapped owner:** Ingest-edge routine operation remains with its mapped service
      owner; cross-service gate review remains with Alex.

      - **Decision needed:** Leave the bounded-decompression release in production
      and define the owner-led fairness or capacity follow-up.

      - **Escalation condition:** A production rollback gate fires, including a permit
      leak, active-work limit violation, dropped accepted points, or the applicable
      sustained request-p99 threshold.


      ## 3. Lantern deploy provenance


      - **Invariant:** Emit an external deploy event only when all required provenance
      validates; otherwise represent the result as explicit unknown with a machine-readable
      missing-provenance reason.

      - **Observed evidence:** The corrected fixture rejects partial deploy objects,
      covers each missing required field with negative tests, performs authorization
      before lookup, and does not use internal room metadata or inferred ownership.

      - **Current exception or uncertainty:** Guarded internal validation is active,
      but customer access remains closed; no external preview access is granted by
      this correction.

      - **Mapped owner:** Alex defines the external data and failure-mode requirements;
      Iris leads product interpretation.

      - **Decision needed:** Approve the fail-closed correction and focused tests
      without broadening the external contract.

      - **Escalation condition:** Any implementation emits partial provenance, consults
      internal-only metadata, or treats guarded internal validation as customer access.


      ## 4. Rollup correction backlog


      - **Invariant:** Correction processing must preserve assignment epochs, complete
      assignment snapshots, minimum-watermark evaluation, matching checkpoints and
      compaction IDs, and duplicate-free publication.

      - **Observed evidence:** The correction-backlog evidence is still under review.

      - **Current exception or uncertainty:** The backlog increase must be distinguished
      between bounded backfill and a stuck correction loop, checkpoint mismatch, duplicate
      processing, or publication risk.

      - **Mapped owner:** Cyrus''s data-platform team retains rollup-service implementation
      and operational ownership.

      - **Decision needed:** Decide whether the production fix remains in place and
      what owner-led pacing, capacity, or alert-tuning follow-up is justified.

      - **Escalation condition:** Evidence of repeated processing, checkpoint or assignment
      mismatch, duplicate output, loss of first-pass currency, or a broken complete-assignment-snapshot
      gate.

      '
    folder: null
    created_at: '2024-06-13T11:20:00-04:00'
  - id: doc_1719252300000
    title: Lantern customer-preview prototype — June 24 validation evidence
    body: '# Lantern customer-preview prototype — June 24 validation evidence


      ## Prototype scope


      The first customer-preview prototype was exercised against metrics-router and
      ingest-edge data. Positive fixtures covered provenance-complete deploy movement
      from both services and fresh published owner-map ownership. The run also included
      negative fixtures for protected or non-authoritative data.


      ## Validated behavior


      - Metrics-router deploy movement rendered only when the complete provenance
      chain validated.

      - Ingest-edge deploy movement rendered only when the complete provenance chain
      validated.

      - Fresh published ownership rendered with its owner-map source.

      - Provenance links rendered correctly.

      - Source timestamps displayed correctly.


      ## Rejected fixtures


      The following fixtures failed closed and did not reach the rendered object:


      - Raw incident body.

      - Internal room name.

      - Employee identifier.

      - Ownership record with no published source.

      - Stale ownership source.


      ## Authorization and source-validation boundary


      Authorization and source validation must occur before rendering. The prototype
      does not use internal room metadata, protected fields, inferred ownership, or
      an unpublished or stale source as a fallback. A successful prototype check is
      evidence that the tested boundary behaved correctly; it is not customer readiness
      and does not authorize customer access.


      ## Product and access decision


      Iris approved the product interpretation of the prototype evidence. Alex and
      Iris approved moving only to internal security and product-readiness review.
      Customer access remains closed.


      ## Required next-stage test work


      The following areas were not exercised and remain required next-stage test work:


      1. Incident-load summaries.

      2. The complete explicit-unknown-state suite.


      These are required before any later readiness or access decision; they are not
      minor follow-ups.'
