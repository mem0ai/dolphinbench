  - id: doc_1743793500013
    title: Infra cross-service proposal intake — effective April 7
    body: '# Infra cross-service proposal intake


      ## Through May 11, 2027

      Every Infra cross-service proposal must separately name the mapped implementation
      and release owner, the rollback owner, and any invariant, provenance, failure-mode,
      ownership, or escalation exception owner. Without a listed exception, the mapped
      owner uses the ordinary release process. When an exception is triggered, the
      named exception owner reviews only that boundary.


      ## Effective May 12, 2027

      Every cross-service exception request must:


      - Name the mapped implementation or release owner.

      - Select exactly one of `invariant`, `provenance`, `failure_mode`, `ownership`,
      or `escalation`.

      - State the observed failed or at-risk condition.


      If any required field is absent, the request returns to the mapped owner without
      entering Alex’s review lane. If the request enters Alex’s lane, Alex reviews
      only the named boundary and does not approve the implementation or release.


      The first 34-request audit motivating this correction found 13 requests with
      an actual listed exception and 21 requests seeking ordinary implementation review,
      routine release approval, or owner follow-up without naming an observed exception.
      Raw service names, mapped-owner details, pull-request identifiers, and reasons
      remain in audit records rather than metric labels.'
