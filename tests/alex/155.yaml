  - id: doc_1724260200006
    title: Shard-keeper lease-transfer verification — bounded owner-run candidate
    body: '# Shard-keeper lease-transfer verification — bounded owner-run candidate


      ## Status and boundary

      This is a candidate for investigation, not an accepted operating change and
      not an ownership change. The shard-keeper owner map and mapped deployment responsibility
      remain unchanged while Hema evaluates the procedure.


      ## Proposed serving-safety evidence

      - Verify that the old holder''s serving gate closes before any later routing
      response from that holder.

      - Verify exactly one serving holder throughout the transfer.

      - Record stale or post-lease-loss responses and lease-epoch behavior.

      - Treat any stale response or nonmonotonic epoch as a stop condition.


      ## Proposed availability evidence

      Track replacement acquisition time, request p99, errors, and restarts separately
      from serving safety. A slower acquisition or temporary p99 increase is availability
      evidence to investigate; it is not by itself evidence of stale serving. No latency-threshold
      change is proposed by this candidate.


      ## Operator authority

      A named mapped operator must be identified before any bounded owner-run procedure
      is proposed. The operator may run only the reviewed procedure within the mapped
      ownership boundary; this document does not authorize a production ownership
      transfer or an unreviewed run.


      ## Stop, recovery, and escalation

      Stop on a stale response, nonmonotonic epoch, failure of the old-holder gate
      ordering, more than one serving holder, an error spike, or a restart. Preserve
      the evidence, return to the known safe serving state, and escalate the stopped
      result to the shard-keeper service owner and Hema for review before any further
      run.


      ## Candidate decision

      The next step is to collect representative evidence and determine whether this
      can become a bounded owner-run process. The procedure must not be treated as
      accepted until the evidence, operator, thresholds, stop conditions, and recovery
      path have been reviewed.'
