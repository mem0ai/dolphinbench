  - id: doc_1823276400011
    title: Q4 triggered review — metrics-router cancellation terminal accounting —
      October 11, 2027
    body: '# Q4 triggered review — metrics-router cancellation terminal accounting
      — October 11, 2027


      ## Intake

      - Affected component: metrics-router replacement activation

      - Mapped implementation and release owner: Wes

      - Exception class: `failure_mode`

      - Concrete observed condition: after an activation attempt was accepted, deploy-pipeline
      cancellation could emit caller-visible `cancelled` while a concurrent activation
      worker committed publication and emitted caller-visible `published` for the
      same attempt.


      ## Initial observed evidence

      Staging reproduced both caller-visible terminal outcomes in 14 of 10,000 cancellation-versus-commit
      interleavings.


      ## Passing correction evidence — October 14

      Across 5,000 cancellation-versus-activation-commit races, including cancellation
      immediately before and after the commit boundary, every accepted attempt produced
      one durable attempt result and exactly one caller-visible terminal outcome.


      ## Passing process-crash evidence — October 26

      Across 3,000 crashes before, during, and after the cancellation-versus-publication
      commit boundary, restart recovered one durable attempt identity and exactly
      one caller-visible terminal outcome for every accepted attempt. No attempt produced
      both `cancelled` and `published`.


      ## Partial disconnect evidence — November 9

      Across 2,000 post-acceptance disconnect cases, the server retained one durable
      attempt identity and one terminal journal record with no duplicate execution.
      The harness did not reconnect or retry as the caller, so caller-visible recovery
      remained open.


      ## Final caller-recovery evidence — December 8

      Across 2,000 post-acceptance disconnect cases, the caller reconnects or retries
      using the same durable attempt identity and receives the original single terminal
      outcome. No retry creates another attempt, re-executes accepted work, or creates
      a second terminal record.


      ## Closure

      The durable-attempt identity, exactly-one terminal outcome, cancellation ordering,
      process-crash recovery, and caller-visible reconnect or same-attempt retry requirements
      are satisfied. Alex’s caller-visible terminal-outcome boundary is closed.


      ## Ownership boundary

      Wes retains implementation, release, and rollback authority. Closing Alex’s
      failure-mode boundary does not approve implementation or release.'
