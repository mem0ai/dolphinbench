  - id: doc_1697210220000
    title: Cardinality Guardrails — first failure-mode matrix
    body: '# Goal

      First-cut controls for the Q4 Cardinality Guardrails work; keep it tied to the
      September mirror/replay legacy-aggregator wobble without turning validation
      movement into rollback criteria.


      # First-cut matrix


      ## 1. Label limits

      - Failure mode: unbounded or newly introduced label keys/values causing fanout.

      - Candidate control: a narrow allowlist or budget per sensitive label family.

      - Preflight: flag new high-cardinality labels before a metrics-router or shard-keeper
      push.


      ## 2. Alert-source semantics

      - Failure mode: responders treating replay/mirror validation movement as live-path
      rollback evidence.

      - Candidate control: dashboard and alert wording that marks live metrics-router
      traffic separately from replay or mirror validation samples.


      ## 3. Label-change preflight

      - Failure mode: a config or parser change adding labels without checking cardinality
      behavior.

      - Candidate control: a pre-push checklist with sample counts, source label,
      owner, and rollback/non-rollback semantics.


      # Non-goals

      - No customer-facing dashboard.

      - No general telemetry rewrite.

      - No legacy-aggregator retirement claim.

      - No claim that the 2% replay sample creates immediate storage savings.

      - No Q3 incident framing.


      # Monday questions

      - What cost examples can Cyrus bring by label family?

      - Which preflight checks are service-owned by Alex versus data-platform advisory?

      - What would make the first cut too broad?


      ## Bounded observability example — exception-review outcomes


      The accepted production counter uses only these bounded labels:

      - `service_pair_class`: `ingest_path`, `routing_path`, `ownership_path`, or
      `other`

      - `exception_class`: `invariant`, `provenance`, `failure_mode`, `ownership`,
      or `escalation`

      - `outcome`: `requested`, `accepted`, or `rejected`


      Raw service names, owner email addresses, pull-request identifiers, and reviewer-supplied
      reasons remain in logs or audit records rather than metric labels. This example
      creates no centralized review owner: mapped owners retain implementation, operational,
      release, and rollback responsibility, while boundary review remains limited
      to the triggered cross-service exception.'
    folder: Eng
    created_at: '2023-10-13T11:17:00-04:00'
    updated_at: '2027-03-26T09:05:00-04:00'
  - id: doc_1698694200004
    title: INC-2023-10-30-001 metrics-router canary rollback — lightweight after-action
    body: '# INC-2023-10-30-001 metrics-router canary rollback — lightweight after-action


      ## Summary

      A metrics-router canary for `sha:b41c77a` was rolled back after live-path p99
      and dropped writes moved on the canary slice. Replay and mirror validation panels
      were not the rollback trigger.


      ## Timeline

      - 08:07 ET — Page fired for live metrics-router p99 on canary slice. Alex acknowledged
      the incident.

      - 08:22 ET — Live-path p99 was around 118 ms, error rate was 0.18%, and dropped
      writes were 0.6% on the canary slice. Alex rolled back the most recent metrics-router
      deploy.

      - 09:05 ET — p99 returned to about 46 ms, error rate returned to roughly 0.02%,
      and dropped writes returned to zero.


      ## What changed

      The canary appears to have changed the `route_pattern` normalization path so
      one live handler emitted raw account/widget IDs instead of normalized route
      patterns. Replay validation still showed normalized route patterns, so replay
      evidence alone would not have caught the live hot-path value-shape change.


      ## Why rollback was appropriate

      The signal was live-path metrics-router movement: p99 and dropped writes on
      the canary slice. Replay or mirror validation movement remains investigation
      evidence, not rollback criteria.


      ## Follow-ups

      1. Keep the code fix small: restore normalized `route_pattern` values for the
      affected live handler before another canary.

      2. Patch the Cardinality Guardrails checklist so live-path label value-shape
      changes require live canary evidence or a representative live-path fixture,
      not only replay validation.


      ## Non-goals

      This note is not a broad incident postmortem, not a legacy-aggregator retirement
      discussion, and not a claim that Cardinality Guardrails is complete.'
    folder: Eng
    created_at: '2023-10-30T15:30:00-04:00'
  - id: doc_1699375200001
    title: Lantern narrow adoption — Nov 7 decision
    body: '# Lantern narrow adoption — Nov 7 decision


      ## Decision

      Theo approved a narrow internal-adoption step for Lantern, with Hema''s backing.


      Lantern may be used in selected release reviews and incident follow-ups for
      Infra and Product Engineering.


      ## Access boundary

      Access stays bounded to the selected internal operating rooms and existing responsible
      participants. This is not a company-wide rollout.


      ## Surface boundary

      The adopted surface shows:

      - deploy movement,

      - provenance-backed ownership,

      - incident-load summaries,

      - empty states when the source data is missing or not permissioned.


      The adopted surface does not show raw incident bodies and does not make readiness
      judgments.


      ## Ownership/provenance rule

      Ownership cards must be backed by recorded owner-map provenance. Missing owner
      data should be fixed at the owner-map source, not patched manually in the UI.


      ## Non-goals

      - Not customer-facing.

      - Not company-wide.

      - Not a manager-readiness dashboard.

      - No raw incident bodies.

      - No release-readiness scoring.

      - No manual owner-card overrides.'
