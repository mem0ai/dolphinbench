  - id: doc_1784726280000
    title: Lantern platform-reference rehearsal — contract and failure-mode questions
    body: '# Purpose


      Working record for Hema''s authorized internal-only, staff-only Lantern platform-reference
      rehearsal. The combined-payload candidate was rejected on August 18, the corrected
      reference-only implementation was selected, and the scheduled September 8 executable
      rehearsal is now complete. The resulting evidence is suitable for a later platform
      decision but does not itself authorize customer use or make that decision.


      # Ownership split


      - Product Engineering owns implementation.

      - Alex owns the cross-system contract and failure-mode review.

      - Cyrus owns the Cardinality Guardrails authority interface and cost semantics.

      - Wes owns the metrics-router operating-limit mapping.

      - Iris owns interpretation and adoption criteria.

      - Published responsibility remains authoritative in the owner map.

      - Pipeline limits and cost semantics remain authoritative in Cardinality Guardrails.


      # Contract and failure-mode requirements


      - Bind tenant identity for every input, authority reference, cache object, trace,
      and rendered rehearsal result.

      - Complete authorization before any source or authority adapter call.

      - Use canonical published service identity and only qualifying tenant-scoped
      owner-map aliases; missing or conflicting aliases must fail closed.

      - Preserve each authoritative record''s own provenance and `source_timestamp`;
      fetch, generation, and attempt times remain separate metadata and cannot substitute
      for a missing source timestamp.

      - Do not copy owner-map responsibility, operating-limit values, or cost values
      into Lantern.

      - Do not introduce writeback, correction, or mutation capability.

      - Keep every rehearsal request, authority call, cache, trace, artifact, and
      rendered result outside the Harbor Health and Mosaic Commerce customer paths.


      # August 18 design decision


      Product Engineering''s combined-payload candidate copied the metrics-router
      operating limit and estimated cost into a Lantern-owned payload and attached
      an owner-map mutation endpoint. Alex rejected it because it would make Lantern
      a second authority for Cardinality Guardrails data and create a write path into
      published responsibility. Cyrus confirmed that cost semantics remain in Cardinality
      Guardrails, and Iris confirmed that Lantern may explain and navigate to authoritative
      detail without presenting copied values as Lantern''s own.


      The selected reference-only contract contains exactly:


      - `tenant_id`

      - `canonical_service_id`

      - `authority_type`

      - `authority_record_id`

      - `source_timestamp`


      It may contain neither authority payload values nor mutation capability.


      # September 8, 2026 — executed rehearsal results


      The corrected 1:00–2:00 PM staff-only rehearsal is complete. Product Engineering
      exercised the reference-only model using exactly the five selected fields, with
      no authority payload values and no mutation capability.


      ## Authority-reference cases


      - Harbor Health''s `claims-edge` event resolved through its valid owner-map
      alias to canonical `claims-ingest`.

      - The conflicting-overlap fixture remained separate and rendered explicit unknown
      ownership.

      - Mosaic Commerce''s metrics-router example identified Cardinality Guardrails
      as the authority for the 64-pending-batches-per-tenant control without copying
      the limit or any cost value into Lantern.


      ## Executed counts and failure cases


      - Total tenant-scoped rehearsal lookups: 96.

      - Harbor Health lookups: 48.

      - Mosaic Commerce lookups: 48.

      - Denied lookups: 8, with zero adapter calls.

      - Stale or missing inputs: 6, all rendered explicit unknown.

      - Cross-tenant lookups or material: 0.

      - Excluded-field exposures: 0.

      - Write paths or mutation capability: 0.

      - Lookups missing required provenance: 0.

      - Lookups missing a required source timestamp: 0.

      - Unpublished ownership renders: 0.


      Iris confirmed that the reference wording does not imply release readiness,
      cost interpretation, or employee performance.


      # Customer-path and decision boundary


      The reference-only model remains staff-only and inactive in both Harbor Health
      and Mosaic Commerce. No rehearsal request, artifact, or output entered or modified
      either customer path. This update does not claim customer authorization, customer
      exposure, an access expansion, or a platform-cycle decision.


      # Remaining handoff


      - The September 18 operating-evidence and rehearsal review remains pending.

      - Iris or Product Engineering still needs to confirm the blanket reviewer-routing
      correction.

      - Any decision to advance the reference-only model beyond staff-only rehearsal
      remains separate and requires later review and authorization.'
