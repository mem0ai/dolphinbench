  - id: doc_1774877040004
    title: Lantern platform-line operating handoff — April 1
    body: '# Lantern platform-line operating handoff — April 1


      ## Purpose and effective-date boundary

      This is the operational handoff for implementation and operating clarity. It
      is not a new strategy or authorization decision. The existing Lantern authorization
      remained in force through March 31, 2026. The platform-line direction, role
      split, and extended access terms became active on April 1.


      ## Product and system boundary effective April 1

      - Lantern is a Sphere product-platform line that explains provenance-backed
      service and system state.

      - Cardinality Guardrails owns pipeline limits and cost signals.

      - The owner map remains the source of published responsibility.

      - Lantern does not produce release-readiness judgments or employee-performance
      interpretations.

      - Per-service telemetry cost remains outside customer authorization through
      September 30, 2026.


      Any new source type enters through shared registration that enforces tenant-scoped
      authorization before source access, required provenance and source timestamps,
      explicit unknown for stale or missing input, excluded-field checks, and a successful
      safety rerun before customer use.


      ## Role split effective April 1

      - Iris owns the customer promise, adoption criteria, and UI interpretation.

      - Alex owns freshness, tenant-isolation, authorization-denial, latency, and
      error monitoring plus the shared data contract, source-registration safety gates,
      and failure-mode review.

      - Product Engineering owns implementation.


      ## Authorized accounts and permitted surface: April 1–September 30, 2026

      Harbor Health and Mosaic Commerce—and no other accounts—continue with read-only
      access. Broader customer access remains unauthorized. Every lookup continues
      to use the shared authorization wrapper. The permitted surface is limited to:

      - provenance-backed deploy movement;

      - published service ownership;

      - timestamped incident-load summaries; and

      - explicit unknown states.


      ## Exclusions

      No additional account, cost data, CSV export, raw incident text, internal room
      metadata, employee identifier or comparison, inferred or unpublished ownership,
      internal-only fallback data, or write capability is authorized.


      ## Automatic suspension conditions

      An authorization-wrapper bypass, adapter call after denial, cross-tenant material,
      stale or missing source rendered as anything other than explicit unknown, deploy
      event without required provenance, unpublished ownership, incident-load summary
      without its source timestamp, exposure of any excluded field, or loss of read-only
      enforcement immediately suspends both accounts pending correction and a successful
      rerun of the affected safety check.


      Latency and other errors do not independently suspend access unless they cause
      one of those violations.


      ## April 1 operating-handoff record

      At the April 1 handoff, deploy movement and published ownership already used
      Lantern''s shared source registration, while incident-load summaries still duplicated
      tenant authorization, provenance, timestamp, freshness, and exclusion metadata
      in adapter-local configuration. Hema assigned Product Engineering to migrate
      the existing incident-load source into shared registration by April 17, 2026.
      Alex owned the Lantern Preview Safety Check LPS-001 rerun, and Iris owned the
      customer-interpretation check.


      The migration controls required tenant authorization before source access; Lantern
      Incident-Load Provenance Schema LILP-1, with the tenant-scoped provenance source
      identifier as its required provenance field; the required source timestamp;
      explicit unknown for stale or missing input; read-only enforcement; and continued
      exclusion of cost data, CSV export, raw incident text, internal room metadata,
      employee identifiers or comparisons, inferred or unpublished ownership, and
      internal-only fallback data.


      LPS-001 failed on an authorization-wrapper bypass, an adapter call after denial,
      cross-tenant material, stale or missing input rendered as anything other than
      explicit unknown, missing required provenance, unpublished ownership, an incident-load
      summary without its source timestamp, exposure of an excluded field, or loss
      of read-only enforcement.


      The customer-interpretation acceptance check required paired pre- and post-migration
      explanations to communicate the same incident-load state for the same tenant,
      published service, and source timestamp. Stale or missing input had to remain
      explicit unknown, and the wording could add no release-readiness judgment, causal
      claim, employee-performance interpretation, or newly authorized data.


      ## April 17 completion

      Product Engineering completed the scheduled April 17 migration of Lantern''s
      existing incident-load source from adapter-local configuration into shared registration.
      The operating path now evaluates tenant authorization before source access,
      uses Lantern Incident-Load Provenance Schema LILP-1 with the tenant-scoped provenance
      source identifier and required source timestamp, renders stale or missing input
      as explicit unknown, preserves the full excluded-field list, and remains read-only.
      All three existing Lantern customer source families now use shared registration.


      ### Lantern Preview Safety Check LPS-001

      Alex ran LPS-001 over 240 tenant-scoped lookups: 120 for Harbor Health and 120
      for Mosaic Commerce. Sixteen denied requests made no adapter call. Twelve stale
      or missing inputs rendered explicit unknown. No lookup produced an authorization-wrapper
      bypass, cross-tenant material, missing required provenance, a missing required
      source timestamp, an excluded field, unpublished ownership, or a write.


      ### Customer-interpretation acceptance

      Iris completed the paired interpretation check and confirmed that each reviewed
      pre- and post-migration pair communicated the same incident-load state for the
