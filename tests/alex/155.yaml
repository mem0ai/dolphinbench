  - id: doc_1753112700019
    title: Cross-service failure-case intake template
    body: '# Cross-service failure-case intake


      ## Role boundary

      - Wes maintains and teaches the responder-path scenarios.

      - Nadia retains the postmortem section.

      - Alex maintains only the cross-service failure cases.

      - This intake does not make Alex the scenario-program owner and does not create
      a new approval gate.


      ## Intake requirements and routing

      Every cross-service exception request must state all four of these things before
      it enters review:


      1. the affected component;

      2. the mapped implementation or release owner;

      3. exactly one selected boundary: `invariant`, `provenance`, `failure_mode`,
      `ownership`, or `escalation`; and

      4. a concrete observed failed or at-risk condition.


      Nadia owns this front-door check. If any one of the four items is absent, including
      when the condition is only placeholder text such as `needs review` or `possible
      risk`, she returns the request to the mapped owner without review. A complete
      request goes to the named owner for its one selected boundary. Alex receives
      it only when that boundary requires his review, and he reviews only that boundary.
      Nadia does not make implementation, release, or rollback decisions; those decisions
      remain with the mapped owner.


      ## Scenario scope

      - Affected services:

      - Cross-service boundary or dependency:

      - System control being tested:

      - Expected safe state:


      ## Incident timing

      - Incident clock start:

      - Detection time:

      - Isolation status and time:

      - Secondary-engagement deadline:

      - Expected secondary-escalation point:

      - Actual secondary engagement, if exercised:


      ## Stop conditions

      - Stop condition 1:

      - Stop condition 2:

      - Stop condition 3:

      - Evidence required to classify a stop:

      - Known safe recovery state:


      ## Expected responder path

      - First responder action:

      - Owner handoff point:

      - Rollback or mitigation path:

      - Evidence to preserve:


      ## Review details

      - Selected boundary:

      - Why this boundary applies:

      - Mapped implementation or release owner:

      - Reviewer needed for the selected boundary:


      Nadia returns an incomplete request without review. For a complete request,
      the mapped implementation or release owner remains responsible for the work,
      and any reviewer examines only the one selected boundary. This template creates
      no centralized approval, new approval gate, ownership change, or Alex program-ownership
      role.


      ## April 27, 2026 — Lantern authorization-before-source-access scenario


      ### Scenario

      During the April Lantern migration preflight in staging, all 20 unauthorized
      lookups were ultimately denied, but every one constructed and initialized the
      incident-load adapter before authorization completed. Two of those 20 requests
      also accessed the source. This is a blocked pre-authorization candidate, not
      a deployed customer incident. The candidate is not deployed, and existing customer
      access remains unchanged.


      ### Expected boundary analysis

      - Authorization must complete before incident-load adapter construction or source
      access. A final denial is insufficient if the adapter was constructed or the
      source was accessed first.

      - Keep existing customer access unchanged while the candidate remains undeployed.

      - Require denial regressions showing zero adapter constructions and zero source
      calls, followed by the affected LPS-001 rerun, before migration acceptance.

      - Preserve the ownership boundary: Product Engineering remains the mapped implementation
      and release owner. Alex maintains this cross-service failure case and reviews
      the shared safety and failure-mode boundary; this scenario does not make Alex
      Product Engineering''s implementation or release owner.


      This case is for future quarterly incident practice under the existing module
      split: Wes owns and teaches responder paths, Nadia retains the postmortem section,
      and Alex maintains cross-service failure cases.


      ## October 16, 2026 — shard-keeper lease-loss and serving-gate case


      ### Tested staging sequence

      1. The old holder closes its serving gate on lease loss.

      2. The replacement remains out of routing while it catches up.

      3. Routing begins only after the replacement opens its serving gate.


      ### Failure triggers

      - Any overlapping serving holders.

      - Any routing to a closed serving gate.

      - Any request without exactly one terminal result.


      ### Role and ownership boundaries

      - Wes owns and teaches the responder path.

      - Nadia retains the postmortem material.

      - Alex maintains only this cross-service failure case.

      - Shard-keeper remains outside Wes’s solo scope.

      - The clean October 16 result was a paired staging drill only; it made no production
      or ownership change.


      ## November 10, 2026 — facilitator-only timing for shard-keeper handoff exercise


      ### Timed inject sequence

      - **T+0 — Baseline:** Present the old lease holder as serving and the replacement
      as catching up. Ask responders to state lease ownership, serving-gate state,
      routing eligibility, and request-accounting obligations separately.

      - **T+4 — Lease transfer:** Transfer the lease before the replacement serving
      gate opens. Require responders to keep the replacement out of routing until
      its serving gate opens.

      - **T+8 — In-flight request:** Reveal one request that the old holder accepted
      before lease loss and that remains in flight. Require a terminal accounting
      for that request independent of listener closure or current lease ownership.

      - **T+12 — Listener closure prompt:** State that the old listener has closed.
      Ask whether that proves the accepted request reached a terminal result. Do not
      accept listener closure as sufficient evidence.

      - **T+16 — Reconciliation:** Require a final timeline showing routing eligibility
      for both holders and exactly one terminal outcome for the pre-lease-loss request.


      ### Scoring points

      Award one point for each:

      1. Separating lease ownership from serving eligibility.

      2. Keeping the replacement out of routing until its serving gate opens.

      3. Treating old-listener closure as distinct from request completion.

      4. Recording exactly one terminal outcome for the request accepted before lease
      loss.

      5. Preserving the role and scope boundaries: Wes teaches the responder path;
      Nadia retains postmortem material; Alex maintains only the cross-service failure
      case; Cyrus covers the Data Platform boundary.


      This is facilitator-only training material, not a production drill, system change,
      ownership change, or expansion of Wes’s solo shard-keeper scope.


      ## November 10, 2026 — shard-keeper handoff training result


      The quarterly incident-practice session is complete. Participants correctly
      kept the replacement holder out of routing until its serving gate opened and
      identified that lease ownership alone did not establish serving eligibility.


      In two of four response timelines, the responder initially treated closing the
      old listener as sufficient and omitted the terminal outcome for the request
      accepted before lease loss. After the facilitator inject, both responders corrected
      the timeline and accounted for that request exactly once. Retain this as training
      evidence for future responder-path practice.


      This was training only. No production drill, deployment, or system change occurred.
      Wes still owns and teaches the responder path; Nadia retains postmortem material;
      Alex maintains only the cross-service failure case; Cyrus retains the Data Platform
      boundary; and Wes’s solo shard-keeper scope did not expand.


      ## January 28, 2027 — facilitator-only ingest-edge shutdown scenario


      ### Timed scenario

      - **T+0 — Accepted work:** State that ingest-edge has already accepted 200 requests
      into tenant queues. Ask responders to name the accounting obligation for all
      accepted work.

      - **T+4 — Readiness and listener change:** Readiness turns false and the listener
      closes. Ask responders to separate refusal of new work from responsibility for
      requests already accepted.

      - **T+8 — Dispatch-loop exit:** Reveal that the dispatch loop exits with 37
      requests still queued, leaving only 163 terminal outcomes. Ask whether listener
      closure or false readiness is sufficient evidence that accepted work completed.

      - **T+12 — Reconciliation:** Require responders to reconcile all 200 accepted
      requests without duplication and identify the missing 37 terminal outcomes.

      - **T+16 — Incident clock:** If isolation has failed while the primary remains
      in the incident and the cause is not isolated, require engagement of the secondary
      before the established 45-minute boundary.


      ### Facilitator prompts

      1. What changes for new work when readiness becomes false and the listener closes?

      2. What obligation remains for the 200 requests already accepted into tenant
      queues?

      3. Does dispatch-loop exit prove completion? If not, what terminal evidence
      is missing?

      4. How will responders demonstrate that every accepted request either drained
      or received one explicit terminal result?

      5. How will responders reconcile all 200 requests exactly once, without loss
      or duplication?

      6. When does the established incident-clock rule require the secondary to be
      engaged if isolation fails?


      ### Scoring points

      Award one point for each:

      1. Separating refusal of new work from responsibility for accepted work.

      2. Requiring every accepted request to drain or receive one explicit terminal
      result.

      3. Reconciling all 200 accepted requests without duplication, including the
      37 initially left queued.

      4. Engaging the secondary before the 45-minute boundary when the primary remains
      in the incident and the cause is not isolated.

      5. Preserving the role split: Wes teaches the responder path, Nadia reviews
      the postmortem section, and Alex contributes only the cross-service failure
      case.


      ### Boundaries

      This is facilitator-only training material for the January 28 quarterly incident-practice
      session. It does not claim that the old owner remediation or any production
      change has completed, does not transfer Wes''s responder-path teaching or Nadia''s
      postmortem review to Alex, and creates no production action or ownership change.


      ## April 5, 2027 — metrics-router startup-budget responder exercise


      ### Scenario

      A staged metrics-router replacement rollout contains ten instances compiling
      the 40,000-route matcher fixture. Compilation times range from 25 to 34 seconds
      against the deploy pipeline’s fixed 30-second readiness timeout. Eight instances
      become ready and join on their first attempt. Two remain correctly unready past
      30 seconds, are terminated, and restart before joining. Readiness correctly
      stays false while compilation is incomplete. Production is unchanged.


      ### Responder tasks

      1. Identify Wes and the mapped metrics-router owner path as responsible for
      ordinary implementation, release, and rollback decisions.

      2. Classify the restart-loop exposure as a failure-mode exception at the deploy-pipeline
      readiness boundary.

      3. Require evidence that every replacement instance becomes eligible within
      the readiness budget, backed by an executed replacement rollout with no restart-loop
      behavior, before release.

      4. Preserve Alex’s bounded role: Alex reviews only the triggered failure-mode
      boundary and is not the implementation owner or release approver.


      ### Expected classification and boundary

      The ordinary implementation and release path remains with Wes as metrics-router
      primary. Alex maintains this reusable cross-service failure case and reviews
      only the triggered startup/readiness failure boundary. This exercise creates
      no centralized approval gate or ownership change.


      ## April 27, 2027 — revised facilitator contrasts


      1. **Readiness-budget evidence:** A replacement instance that exceeds a fixed
      readiness budget must remain unroutable. Termination or restart is not acceptance
      evidence.

      2. **Terminal accounting:** Terminal-state selection and the matching accounting
      contribution must come from the same winning path.

      3. **Rollback provenance:** Replay samples cannot be presented as live rollback
      criteria.


      ### Preserved ownership split

      - Wes still maintains and teaches the responder path.

      - Nadia still reviews the postmortem framing.

      - Alex maintains only these cross-service failure cases.


      These contrasts do not transfer implementation, release, rollback, or ordinary
      service ownership to Alex and do not create a new approval gate.


      ## May 9, 2027 — PR 2141 staging-versus-production contrast


      ### Contrast

      - The earlier staging candidate had replacement instances exceed the fixed readiness
      budget, terminate, and join only on retry. A restart is not acceptance evidence.

      - The May 6 production rollout kept every replacement unroutable until matcher
      compilation finished, and every cold start stayed within the fixed readiness
      budget without restart.


      ### Teaching point

      The successful production case passed because readiness and serving eligibility
      remained aligned. Termination or restart must not be presented as proof that
      a replacement satisfied the readiness boundary.


      ### Preserved facilitator roles

      - Wes maintains and teaches the responder path.

      - Nadia reviews the postmortem framing.

      - Alex maintains only the cross-service failure cases.


      This contrast does not transfer implementation, release, rollback, or ordinary
      service ownership to Alex and creates no new approval gate.


      ## May 20, 2027 — facilitator-only cross-service prompts


      1. **Readiness boundary:** If a replacement exceeds the fixed readiness budget,
      what proves it remains unroutable, and why is termination or restart not acceptance
      evidence?

      2. **Terminal winner:** Which single winning path determines both the caller-visible
      terminal result and the matching accounting contribution?

      3. **Rollback provenance:** What source classification is required before evidence
      may be treated as live rollback evidence, and why can missing classification
      not be promoted into that role?


      Wes retains the responder-path teaching portion, Nadia retains postmortem framing,
      and Alex maintains only these cross-service failure-case prompts.'
