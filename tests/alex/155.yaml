  - id: doc_1712582400000
    title: Staff IC evidence review — April 10
    body: '# Staff IC evidence review — April 10


      ## 1. Likely questions and concise answers


      **What demonstrates leverage through systems rather than individual effort?**

      The Guardrails parity mechanism turns a cross-service label correction into
      a repeatable review path: the executable shard-keeper/rollup-service parity
      fixture, affected service-owner signoff, cardinality checks, and alert-source
      checks make the relevant evidence part of production review. The retained `shard_region`
      to `storage_region` case shows the mechanism covering a real contract boundary.


      **How does Lantern demonstrate an ownership boundary?**

      Iris runs Lantern''s ordinary room-admission workflow. I step in only for data-contract,
      failure-mode, or provenance exceptions, rather than approving every ordinary
      room.


      **What does Wes''s work demonstrate?**

      Wes''s bounded first-pass checks show leverage through a practical operating
      mechanism. They do not represent people management, a formal ownership transfer,
      or a change to the owner map.


      **What is the claim about the calibration?**

      The evidence supports a technical, non-managerial scope discussion. It does
      not determine the calibration outcome or make a Staff title effective.


      ## 2. Evidence that demonstrates leverage through systems and boundaries


      - **Guardrails:** The executable parity fixture, affected-owner signoff, cardinality
      check, and alert-source check make producer-consumer evidence reusable for covered
      cross-service label changes. The retained `shard_region` to `storage_region`
      case is concrete evidence of the fixture''s use.

      - **Lantern:** Iris owns the ordinary room-admission lane. My involvement is
      reserved for data-contract, failure-mode, and provenance exceptions, keeping
      the routine workflow with its designated owner.

      - **Bounded first-pass checks:** Wes can perform the agreed bounded first-pass
      checks within his practical backup scope. The owner map and primary accountability
      remain unchanged.


      ## 3. Phrases to avoid


      - “I delegated service ownership to Wes.”

      - “Wes owns the services now.”

      - “I own Lantern''s room-admission workflow.”

      - “The calibration shows that I am Staff.”

      - Any wording that presents bounded first-pass checks as people management,
      formal ownership transfer, or a completed title decision.


      The formal calibration remains underway for the next review cycle, and no Staff
      title is effective.


      ## April 22, 2026 — boundary-and-leverage addendum


      Two current examples show that my cross-service role creates reusable boundaries
      without centralizing implementation or release authority.


      - **Proposal intake:** The April 7 proposal-intake rule separately names the
      mapped implementation and release owner, rollback owner, and any triggered invariant,
      provenance, failure-mode, ownership, or escalation exception owner. If no exception
      is triggered, the mapped owner follows the ordinary release process; if one
      is triggered, the named exception owner reviews only that boundary.

      - **Lantern incident-load migration:** On April 17, Product Engineering retained
      implementation ownership and Iris retained customer interpretation, while I
      owned the shared-registration safety gate and the 240-lookup LPS-001 rerun.
      The migration passed: 16 denied requests made no adapter call, 12 stale or missing
      inputs rendered explicit unknown, and no safety or authorization violation occurred.
      This evidence does not imply an owner-map or customer-access change.


      These examples demonstrate leverage through reusable intake and safety boundaries
      while leaving implementation and release authority with the mapped owners.'
    folder: null
    created_at: '2024-04-08T09:20:00-04:00'
