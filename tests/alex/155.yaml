  - id: doc_1778785680001
    title: Lantern published service alias rule — May 14 decision
    body: '# Deployed status — May 28, 2026


      Product Engineering deployed Lantern PR 1089''s tenant-scoped published-service
      alias resolution for Harbor Health and Mosaic Commerce on May 28, 2026.


      # Resolution rule


      Lantern may resolve a historical service identifier only when the tenant-scoped
      owner map publishes an alias record containing the old identifier, the canonical
      published service identifier, and an effective interval covering the source
      event''s timestamp. Both the effective interval''s start timestamp and end timestamp
      are inclusive, so a source event timestamp equal to either endpoint is covered.


      If no such record exists, the source event timestamp is earlier than the inclusive
      start timestamp, or the source event timestamp is later than the inclusive end
      timestamp, Lantern keeps the signals separate and renders ownership as explicit
      unknown. The UI does not infer a rename from similar names or customer context.


      # Harbor Health result


      The original Harbor Health `claims-edge` event now resolves to published `claims-ingest`
      ownership because its source timestamp is covered by the owner map''s published
      alias interval.


      # Regression evidence


      Across 28 executed fixtures:

      - All 12 valid in-interval aliases joined to their canonical published service
      identifiers.

      - Eight out-of-interval aliases remained separate with explicit unknown ownership.

      - Eight identifiers with no published alias record remained separate with explicit
      unknown ownership.


      # Affected safety rerun


      Alex''s affected safety rerun found no cross-tenant resolution, missing provenance,
      unpublished ownership render, excluded field, adapter call after denial, or
      loss of read-only enforcement.


      # Approved customer-facing wording


      Authorized join: `Published service identity resolved from an owner-map alias
      effective at this source event timestamp.`


      No qualifying alias: `Ownership unknown: no published owner-map alias covers
      this source event timestamp.`


      # Unchanged boundary


      The deployment applies only to Harbor Health and Mosaic Commerce. It adds no
      heuristic identity inference and does not expand the customer data contract.


      ## July 3, 2026 — deployed overlap correction


      Lantern now evaluates every tenant-scoped owner-map alias whose inclusive effective
      interval covers the source event timestamp. If all qualifying records identify
      the same canonical published service, Lantern resolves that identity once. If
      qualifying records identify two or more distinct canonical services, Lantern
      keeps the signals separate and renders ownership as explicit unknown regardless
      of storage order. Both effective-interval endpoints remain inclusive.


      Executed regressions show the overlapping Harbor Health `claims-ingest` and
      `claims-router` records failing closed in both row orders, both inclusive endpoints
      working, and a single valid match resolving normally. Alex''s affected safety
      rerun found no cross-tenant resolution, missing provenance, unpublished ownership
      render, excluded field, adapter call after denial, or loss of read-only enforcement.


      The correction is live for Harbor Health and Mosaic Commerce. Their two-account
      read-only scope and customer data contract remain unchanged.'
