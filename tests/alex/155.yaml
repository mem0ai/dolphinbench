  - id: doc_1739972400000
    title: metrics-router snapshot serialization — staging allocation evidence
    body: '## Evidence


      - This comparison was isolated to staging; no production effect was observed.

      - Under identical replay input, disabling route-table snapshot serialization
      capped resident memory at 2.0 GiB.

      - With serialization enabled, resident memory peaked at 2.55 GiB.

      - Two post-replay garbage collections returned resident memory to 1.88 GiB.

      - Retained heap differed from baseline by less than 2%.

      - Allocation profiles attribute the temporary growth to route-table snapshot
      serialization buffers.


      ## Classification


      The evidence supports temporary allocation pressure during replay, not a retained-memory
      leak.


      ## Owner-scoped follow-up


      A metrics-router owner may investigate reducing peak allocation in staging.
      Any candidate must preserve route-table contents, provenance-checksum consistency,
      bounded reload errors, and the existing activation behavior. This note does
      not authorize a production change.'
    folder: Eng
    created_at: '2025-02-19T08:40:00-05:00'
