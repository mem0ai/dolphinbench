  - id: doc_1720625400004
    title: July operating priorities — preconditions, owner decisions, and readiness
      evidence
    body: '# July operating priorities — preconditions, owner decisions, and readiness
      evidence


      ## Context


      The June 27 Staff IC discussion identified three pieces of evidence to carry
      forward:

      - Wes paused metrics-router without waiting for Alex.

      - The ingest-edge fairness defect stayed isolated from the stable bounded-decompression
      release.

      - Lantern preserved Iris''s product role and the closed-access boundary.


      The operating concern is that several boundaries reached runbooks or tests only
      after an event exposed ambiguity. July work should put those boundaries in place
      before the next event.


      ## Priority 1: Put preconditions ahead of events


      Encode safety and readiness preconditions in tests or runbooks before an event
      exposes ambiguity. The durable checks should state the boundary, the evidence
      required to cross it, the stop condition, and the recovery path. This applies
      to the relevant metrics-router and ingest-edge operating checks and to Lantern
      readiness evidence.


      ## Priority 2: Leave routine bounded decisions with mapped owners


      Preserve the existing owner maps and let routine decisions stay with the people
      already operating inside their mapped or explicitly bounded lanes. Alex should
      stop personally absorbing:

      - Routine first-pass metrics-router canary decisions that Wes can make under
      the existing deploy-pipeline and runbook rules.

      - Routine ingest-edge staging rollback calls that Wes can make within the existing
      practical scope and safeguards.

      - Lantern product-interpretation decisions that belong with Iris, rather than
      making Iris dependent on Alex''s approval for ordinary product choices.


      This is a delegation and operating-boundary clarification, not an owner-map
      change and not an expansion beyond the stated practical scopes. Escalation remains
      appropriate when a decision is outside those bounds or an unusual design-to-engineering
      failure requires it.


      ## Priority 3: Make readiness evidence explicit


      For the Lantern customer preview, every readiness review must separate:

      1. Tested behavior and the evidence that demonstrated it.

      2. Remaining gaps and unvalidated cases.

      3. Access state.


      A passing test or prototype check must not be presented as customer readiness
      or customer access. Iris continues to lead product interpretation, while Alex
      defines the external data and failure-mode requirements. The closed-access boundary
      remains explicit until the applicable readiness work is complete.


      ## July working rule


      Before an event or review, write the precondition, owner, evidence, stop condition,
      and access boundary into the relevant test or runbook. Keep routine bounded
      decisions with their mapped owners and reserve Alex''s involvement for decisions
      outside those bounds.'
