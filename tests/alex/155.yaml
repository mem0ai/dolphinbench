  - id: doc_1755021900004
    title: Metrics-router canary-response walkthrough — facilitator note
    body: '# Metrics-router canary-response walkthrough — facilitator sheet


      > **PROMINENT RECOVERY CALLOUT:** After a stopped window recovers, a fresh decision
      permits exactly one fully observed push. It does not reopen the whole window.
      A later multi-push window requires another separate fresh opening decision after
      that recovery push returns the full health set to baseline.


      ## 1. Opening decision versus operator actions

      - Every owner-led configuration window requires a fresh opening decision from
      Alex.

      - After the window opens, mapped operators may make single-file pushes without
      another approval before every safe push.


      ## 2. In-window limits

      - Retired generations must remain at four or fewer.

      - Cleanup pauses must remain at or below 100 milliseconds.

      - The full health set must return to baseline after every push before another
      push proceeds.


      ## 3. Stop and rollback conditions

      - Crossing either the retired-generation or cleanup-pause threshold stops the
      window immediately.

      - Active-generation inconsistency, route-parity failure, dropped series, reload
      failure, or restart remains a rollback condition.


      ## 4. Correct recovery sequence

      1. Recover and re-establish the full health set.

      2. Obtain a fresh decision for exactly one fully observed recovery push.

      3. Observe that push through return of the full health set to baseline.

      4. If another multi-push window is needed, obtain a separate fresh opening decision.


      ## Teaching boundary

      This sheet is teaching material. It is not a production authorization, ownership
      change, or expansion of Wes''s shard-keeper scope.'
