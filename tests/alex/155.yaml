  - id: doc_1825090800008
    title: Q4 incident practice — November 18 scoring sheet
    body: '# Q4 incident practice — November 18 scoring sheet


      ## Scope

      A bounded tabletop scoring sheet, not a production runbook. Score observable
      responder behavior for an accepted metrics-router action across cancellation,
      caller disconnect, process recovery, and publication.


      ## Core criteria

      1. Durable attempt identity

      - Pass: Responders identify the durable acceptance boundary and preserve one
      attempt identity after acceptance.

      - Fail: They create, assume, or accept multiple identities for the same accepted
      attempt.


      2. Terminal accounting

      - Pass: Every accepted attempt reaches exactly one terminal result.

      - Fail: An accepted attempt has no terminal result or exposes conflicting terminal
      results.


      3. Failure classification

      - Pass: Responders distinguish cancellation, caller disconnect, process recovery,
      and publication using the acceptance boundary.

      - Fail: They collapse those cases or treat a pre-acceptance event as evidence
      about accepted work.


      ## Wes — responder path

      Responders must first determine whether durable acceptance occurred before interpreting
      cancellation, caller disconnect, process recovery, or publication. After acceptance,
      they must preserve one durable attempt identity and exactly one terminal result.


      ## Nadia — postmortem criteria

      The postmortem must name the absent system guarantee or control. It must not
      treat the triggering operator action as the root cause, and it must retain the
      mapped implementation and rollback owner.


      ## Final ownership-boundary condition

      - Pass: Mapped owners retain implementation and rollback decisions, while the
      triggered reviewer remains confined to the named failure-mode boundary.

      - Fail: The triggered review is treated as implementation, release, or rollback
      approval.


      ## Additional operating checks — November 8


      ### 45-minute secondary boundary

      - Pass: When the cause remains unisolated, responders engage the secondary before
      the 45-minute boundary and make the incident clock visible.

      - Fail: Responders wait until or after 45 minutes, or continue without engaging
      the secondary while the cause remains unisolated.


      ### Friday staging preparation versus production change

      - Pass: Responders identify staging preparation that makes no production state
      change as staging work and separately identify a Friday-afternoon production
      deploy as prohibited.

      - Fail: Responders classify staging-only preparation as a production deploy,
      or permit a Friday-afternoon production state change because it was described
      as preparation.


      These checks supplement the accepted cancellation, caller-disconnect, durable-attempt,
      terminal-result, mapped-owner, and postmortem criteria. This remains a tabletop
      scoring sheet rather than a production runbook.


      ## November 18 execution order


      - 5 minutes: role and ownership framing.

      - 35 minutes: cancellation and caller-disconnect scenario.

      - 10 minutes: one targeted rerun if a scoring boundary is missed.

      - 10 minutes: debrief and owner follow-up.


      Wes teaches the responder path. Nadia owns the postmortem section. Alex maintains
      only the bounded failure case. This is the exact one-hour tabletop sequence
      and does not turn the scoring sheet into a production runbook.


      ## Observed results — November 18


      The tabletop is complete. Responders correctly separated durable acceptance
      from cancellation, caller disconnect, and process recovery; preserved one attempt
      identity and one terminal result in the exercise; identified Wes as the mapped
      metrics-router implementation, release, and rollback owner; and distinguished
      Friday staging preparation from a production change.


      The first run engaged the secondary at minute 47 while the cause remained unisolated,
      missing the required before-45-minute boundary. The targeted rerun engaged the
      secondary at minute 42 and passed that boundary. Nadia’s debrief named the missing
      system control rather than the triggering operator action as root cause.


      These results are training evidence only. The tabletop did not execute the product
      implementation and does not close any product defect or replace required executable
      product evidence.'
    folder: Eng
    created_at: '2027-11-01T13:40:00-04:00'
    updated_at: '2027-11-18T15:22:00-05:00'
