    title: Lantern platform boundary final decision — March 26 strategy review
    body: '# Lantern platform boundary final decision — March 26 strategy review


      ## Final decision

      The March 26, 2026 strategy meeting is complete. After reviewing the frozen
      operating evidence and the divergent Harbor Health and Mosaic Commerce requests,
      Hema and Theo decided that Lantern will become a Sphere product-platform line
      effective April 1, 2026 rather than remain only a narrow add-on.


      ## Transition boundary

      Through March 31, 2026, Lantern remains a narrow add-on and its existing customer-preview
      authorization remains unchanged. The April direction, role split, and access
      extension do not become active before April 1.


      Harbor Health requested a safe-or-unsafe release label, which would turn observed
      signals into a release-readiness judgment. Mosaic Commerce requested per-service
      telemetry cost beside the ownership and incident-load view, which would require
      Cardinality Guardrails data outside the authorized preview contract. Neither
      capability is enabled under the existing preview.


      ## Product and system boundary effective April 1

      - Lantern explains provenance-backed service and system state.

      - Cardinality Guardrails owns pipeline limits and cost signals.

      - The owner map remains the source of published responsibility.

      - Lantern does not produce release-readiness judgments or employee-performance
      interpretations.

      - Per-service telemetry cost remains outside customer authorization through
      September 30, 2026.


      Any new source type enters through shared registration that enforces tenant-scoped
      authorization before source access, required provenance and source timestamps,
      explicit unknown for stale or missing input, excluded-field checks, and a successful
      safety rerun before customer use.


      ## Role split effective April 1

      - Iris owns the customer promise, adoption criteria, and UI interpretation.

      - Alex retains freshness, tenant-isolation, authorization-denial, latency, and
      error monitoring in addition to the shared data contract, source-registration
      safety gates, and failure-mode review.

      - Product Engineering owns implementation.


      ## Customer authorization: April 1 through September 30, 2026

      Harbor Health and Mosaic Commerce—and no other accounts—are authorized for continued
      read-only access. Every lookup continues to use the shared authorization wrapper.
      The permitted surface is limited to:

      - provenance-backed deploy movement;

      - published service ownership;

      - timestamped incident-load summaries; and

      - explicit unknown states.


      No additional account, cost data, CSV export, raw incident text, internal room
      metadata, employee identifier or comparison, inferred or unpublished ownership,
      internal-only fallback data, or write capability is authorized. Broader customer
      access remains unauthorized.


      ## Automatic suspension conditions

      An authorization-wrapper bypass, adapter call after denial, cross-tenant material,
      stale or missing source rendered as anything other than explicit unknown, deploy
      event without required provenance, unpublished ownership, incident-load summary
      without its source timestamp, exposure of any excluded field, or loss of read-only
      enforcement immediately suspends both accounts pending correction and a successful
      rerun of the affected safety check. Latency and other errors do not independently
      suspend access unless they cause one of those violations.


      ## Frozen evidence reviewed

      The January 1–March 15, 2026 continuation export contains 2,236 customer sessions
      and 431 logical explanation requests: 287 eligible combined explanations, 94
      valid cases kept separate because source timestamps differed by more than 24
      hours, and 50 explicit-unknown outcomes for stale or missing input. There were
      zero eligible renderer failures and no automatic-stop condition. Harbor Health
      used the existing view in seven release follow-ups, and Mosaic Commerce used
      it in six incident handoffs.'
