  - id: doc_1824129000012
    title: Q4 triggered review — rollup-service compaction tenant identity — October
      21, 2027
    body: '# Q4 triggered review — rollup-service compaction tenant identity — October
      21, 2027


      ## Intake

      - Affected component: rollup-service compaction index

      - Mapped implementation and release owner: Roman

      - Exception class: `invariant`

      - Environment: staging

      - Production state: unchanged


      ## Initial observed evidence — October 21

      The compaction identity omitted tenant identity. In 200 paired synthetic-tenant
      fixtures, 26 pairs coalesced across tenants and 11 pairs emitted one tenant’s
      bounded aggregate under the other tenant.


      ## Correction history

      - Tenant identity was added to the compaction identity, stopping the original
      cross-tenant coalescing.

      - Across 600 paired fixtures, raw rows remained separated and correctly attributed.

      - Every bounded aggregate retained tenant identity, but the first oracle was
      output-derived and could agree with a misattributed object.

      - The oracle was then derived independently from paired inputs, but the November
      22 suite compared it only with the first aggregate and checked only counts for
      later aggregates.


      ## Final executed evidence — December 8

      The expected tenant mapping is independently derived from each paired input
      set and compared with every emitted bounded aggregate. Across 3,000 paired-tenant
      fixtures, injected tenant misattribution at the first, middle, and final aggregate
      positions fails, while exact mappings pass. Raw-row separation remains correct,
      and production is unchanged.


      ## Closure

      The tenant-bound compaction identity, raw-row separation, and every-aggregate
      tenant-attribution requirements are satisfied. Alex’s triggered tenant-identity
      invariant review is closed.


      ## Ownership boundary

      Roman retains implementation, release, and rollback authority. Closing Alex’s
      invariant boundary does not approve implementation or release.'
