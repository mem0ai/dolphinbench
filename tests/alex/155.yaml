      - Complete monitoring-export totals for July 10-20 remain pending when the supplied
      records do not contain them.

      - Do not infer customer feedback, cost data, deploy-card identity, contemporaneity,
      causality, or an access decision from missing records.

      - Keep retry and attempt rows separate from logical-request counts.


      ## Safety summary

      Continue to report authorization-wrapper bypass, adapter calls after denial,
      cross-tenant material, stale or missing source rendered as anything other than
      explicit unknown, deploy events without required provenance, unpublished ownership,
      incident-load summaries without source timestamps, excluded material, and loss
      of read-only enforcement separately.


      ## July 25 review outcome


      ### Finding

      - Harbor Health reported one deploy appearing twice in a service timeline.

      - Trace review found twelve retry duplicates: nine Harbor Health cards and three
      Mosaic Commerce cards.

      - Each duplicate pair had the same customer tenant, published service, provenance
      source, and stable source-event ID, but a different ingestion-attempt ID.

      - The duplicates contained no cross-tenant or excluded material and triggered
      no automatic technical stop, but they could falsely imply two deploy movements.


      ### Required deploy-identity rule

      - Identify deploy movement by customer tenant, published service, provenance
      source, and stable source-event ID.

      - Retain ingestion-attempt IDs only as audit evidence.

      - If a movement lacks a stable source-event ID, render it unavailable rather
      than deduplicating heuristically.


      ### Preview and correction status

      - The existing Harbor Health and Mosaic Commerce two-account, read-only preview
      remains active under its unchanged authorization.

      - Product Engineering must implement the correction and provide evidence before
      the next evidence cut.

      - This note does not claim that the correction is implemented or deployed.'
