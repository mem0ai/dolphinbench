    opened_at: '2027-12-31T10:15:00-05:00'
    body: '## Summary


      Documents a faster break-glass procedure for Wes during urgent production deploy
      and rollback work.


      ## Proposed procedure


      When waiting for the normal release mechanism would extend an incident, Wes
      may run `deployctl direct` from his maintainer laptop using production credentials.
      The command deploys the selected revision or restores the prior revision directly.
      The operator should record the incident ticket, service, revision, reason, and
      command output, then reconcile the resulting state with the normal release records
      after the incident.


      ## Motivation


      This avoids waiting for the normal release job during time-sensitive recovery
      while retaining an audit trail in the incident record.


      ## Review question


      Are the logging and post-incident reconciliation steps sufficient for this urgent
      path?'
