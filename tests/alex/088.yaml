id: 088
narrative_anchor_date: '2028-01-01'
test: Inspect metrics-router#3121 and review its proposal to lengthen the OTel collector
  batch window against our earlier batch-window incidents. State the evidence and
  rollout step required before acceptance.
load_bearing_facts:
- 18
- 19
- 24
expected_tool_calls:
- get_pr
- review_pr
grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: review_pr
      action_id: alex_088_review_pr
      path: result.ok
      value: true
      check_id: alex_088_00
    - type: field_equals
      tool: get_pr
      action_id: alex_088_read_pr
      path: result.pr.id
      value: metrics-router#3121
      check_id: alex_088_01
    - type: field_equals
      path: result.review.pr_id
      value: metrics-router#3121
      tool: review_pr
      action_id: alex_088_review_pr
      check_id: alex_088_02
    - type: field_equals
      path: result.review.decision
      value: request_changes
      tool: review_pr
      action_id: alex_088_review_pr
      check_id: alex_088_03
    - type: field_llm_judge
      path: result.review.body
      criterion: The review explains that an overly long batch window previously caused
        the metrics-router memory-spike artifact under burst traffic, that the flush
        interval was reduced from 2 seconds to 1.2 seconds, and that a later batch-window
        regression triggered an automatic canary rollback. It asks for realistic burst
        and memory evidence plus a staged canary before accepting a longer window.
      tool: review_pr
      action_id: alex_088_review_pr
      check_id: alex_088_04
