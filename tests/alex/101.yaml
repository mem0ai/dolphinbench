id: '101'
narrative_anchor_date: '2028-01-01'
test: Inspect lantern#3037 and review whether its service-identity resolution matches
  the established rule.
load_bearing_facts:
- 209
expected_tool_calls:
- get_pr
- review_pr
grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: review_pr
      action_id: alex_101_review_pr
      path: result.ok
      value: true
      check_id: alex_101_00
    - type: field_equals
      tool: get_pr
      action_id: alex_101_read_pr
      path: result.pr.id
      value: lantern#3037
      check_id: alex_101_01
    - type: field_equals
      path: result.review.pr_id
      value: lantern#3037
      tool: review_pr
      action_id: alex_101_review_pr
      check_id: alex_101_02
    - type: field_equals
      path: result.review.decision
      value: request_changes
      tool: review_pr
      action_id: alex_101_review_pr
      check_id: alex_101_03
    - type: field_llm_judge
      path: result.review.body
      criterion: The review requires evaluating every tenant-scoped owner-map alias
        whose effective interval covers the source event timestamp. If all qualifying
        records name the same canonical published service, resolution may occur once.
        If they name different services, the signals remain separate and ownership
        is explicit unknown regardless of row order.
      tool: review_pr
      action_id: alex_101_review_pr
      check_id: alex_101_04
