    title: Resolve historical owner-map aliases
    status: open
    changed_files:
    - path: lantern/identity/owner_map_alias_resolver.ts
      summary: The resolver iterates owner-map alias rows in storage order. For rows
        matching the tenant and historical identifier, it returns the first row whose
        effective_start <= source_event_timestamp <= effective_end, using that row's
        canonical_service_id. If no interval match is found, it selects a canonical
        service in the same tenant using normalized service-name similarity.
    diff_summary: Overlapping active aliases are resolved by the first matching record
      in storage order. When no interval match exists, the patch infers a rename from
      similar service names.
