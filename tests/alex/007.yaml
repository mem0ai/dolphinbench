id: '007'
narrative_anchor_date: '2028-01-01'
test: Create a 20-minute reminder at 7:30 PM Eastern, six weeks before Kibo's current
  dog license expires. In the notes, include the expiration date and whether the renewal
  needs another veterinary visit or certificate.
load_bearing_facts:
- 262
expected_tool_calls:
- create_calendar_event
grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: create_calendar_event
      action_id: alex_007_create_calendar_event
      path: result.ok
      value: true
      check_id: alex_007_00
    - type: datetime_absolute_eq
      path: result.event.start
      value: '2028-05-19T19:30:00-04:00'
      tool: create_calendar_event
      action_id: alex_007_create_calendar_event
      check_id: alex_007_01
    - type: datetime_absolute_eq
      path: result.event.end
      value: '2028-05-19T19:50:00-04:00'
      tool: create_calendar_event
      action_id: alex_007_create_calendar_event
      check_id: alex_007_02
    - type: field_llm_judge
      path: result.event.body
      criterion: The reminder notes state that the current license ends June 30, 2028
        and that the next renewal requires no veterinary visit or additional certificate.
      tool: create_calendar_event
      action_id: alex_007_create_calendar_event
      check_id: alex_007_03
mock_state: {}
mock_state_base:
