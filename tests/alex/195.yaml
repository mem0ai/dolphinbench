  - id: metrics-router#4208
    title: 'metrics-router: add configurable label routing'
    author: devon
    repo: metrics-router
    branch: devon/configurable-label-routing
    status: open
    reviewers:
    - alex
    assignees:
    - devon
    opened_at: '2027-12-30T10:15:00-05:00'
    description: Adds route selection from the HTTP-provided route configuration.
      Includes direct tests for the main routing cases.
    files:
    - path: internal/router/router.go
      patch: "@@\n func selectRoute(labels map[string]string, rules []Rule) string
        {\n-\tfor _, rule := range rules {\n-\t\tif rule.matches(labels) {\n-\t\t\treturn
        rule.Destination\n-\t\t}\n-\t}\n+  for _, rule := range rules {\n+    if rule.matches(labels)
        { return rule.Destination }\n+  }\n \treturn defaultDestination\n }\n@@\n
        func handleRoute(w http.ResponseWriter, r *http.Request) {\n+\trules, err
        := parseRouteConfig(r.Header.Get(\"X-Route-Config\"))\n+\tif err != nil {\n+\t\tlog.Fatal(\"malformed
        route configuration: \", err)\n+\t}\n+\tdestination := selectRoute(readLabels(r),
        rules)\n+\tio.WriteString(w, destination)\n }"
    - path: internal/router/router_test.go
      patch: "@@\n+func TestSelectRouteExactMatch(t *testing.T) {\n+\trules := []Rule{{Label:
        \"env\", Value: \"prod\", Destination: \"primary\"}}\n+\tif got := selectRoute(map[string]string{\"env\":
        \"prod\"}, rules); got != \"primary\" { t.Fatalf(\"got %q\", got) }\n+}\n+\n+func
        TestSelectRouteNoMatch(t *testing.T) {\n+\trules := []Rule{{Label: \"env\",
        Value: \"prod\", Destination: \"primary\"}}\n+\tif got := selectRoute(map[string]string{\"env\":
        \"dev\"}, rules); got != defaultDestination { t.Fatalf(\"got %q\", got) }\n+}\n+\n+func
        TestSelectRouteFirstMatch(t *testing.T) {\n+\trules := []Rule{{Label: \"env\",
        Value: \"prod\", Destination: \"primary\"}, {Label: \"region\", Value: \"west\",
        Destination: \"west\"}}\n+\tif got := selectRoute(map[string]string{\"env\":
        \"prod\", \"region\": \"west\"}, rules); got != \"primary\" { t.Fatalf(\"got
        %q\", got) }\n+}"
    checks:
      ci: passing
