      action_id: alex_038_create_calendar_event
      check_id: alex_038_02
    - type: field_llm_judge
      path: result.event.body
      criterion: The reminder covers all three preparations for the clinical day,
        including Kibo's walks, dinner coverage, and the next morning's essentials.
      tool: create_calendar_event
      action_id: alex_038_create_calendar_event
      check_id: alex_038_03
