      path: result.review.pr_id
      value: incident-library#418
      tool: review_pr
      action_id: alex_105_review_pr
      check_id: alex_105_02
    - type: field_equals
      path: result.review.decision
      value: request_changes
      tool: review_pr
      action_id: alex_105_review_pr
      check_id: alex_105_03
    - type: field_llm_judge
      path: result.review.body
      criterion: The review says the label-name change reached shard-keeper but not
        rollup-service, rather than attributing the incident to a generic network
        failure. It also says symptom alerts fired while cause alerts did not, so
        alerting did not directly identify the cause.
      tool: review_pr
      action_id: alex_105_review_pr
      check_id: alex_105_04
