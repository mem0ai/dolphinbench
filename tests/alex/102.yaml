grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: review_pr
      action_id: alex_102_review_pr
      path: result.ok
      value: true
      check_id: alex_102_00
    - type: field_equals
      tool: get_pr
      action_id: alex_102_read_pr
      path: result.pr.id
      value: lantern#3055
      check_id: alex_102_01
    - type: field_equals
      path: result.review.pr_id
      value: lantern#3055
      tool: review_pr
      action_id: alex_102_review_pr
      check_id: alex_102_02
    - type: field_equals
      path: result.review.decision
      value: request_changes
      tool: review_pr
      action_id: alex_102_review_pr
      check_id: alex_102_03
    - type: field_llm_judge
      path: result.review.body
      criterion: The review limits the reference to tenant_id, canonical_service_id,
        authority_type, authority_record_id, and source_timestamp; removes copied
        authority values and mutation or writeback; and keeps Lantern an explanation
        and navigation layer rather than a second authority. It blocks the proposed
        output in Harbor Health and Mosaic Commerce, or equivalently says both customer
        paths must remain unchanged because their authorization did not expand.
      tool: review_pr
      action_id: alex_102_review_pr
      check_id: alex_102_04
