  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: send_slack_message
      action_id: alex_045_send_slack_message
      path: result.ok
      value: true
      check_id: alex_045_00
    - type: field_equals
      tool: get_service_metrics
