id: '045'
narrative_anchor_date: '2028-01-01'
test: 'Check metrics-router p99_ms and replay-validator mismatch_rate for the last
  hour, then post a recommendation in #incident-metrics. Rollback and restoring legacy-aggregator
  have been proposed.'
load_bearing_facts:
- 81
- 99
expected_tool_calls:
- get_service_metrics
- send_slack_message
