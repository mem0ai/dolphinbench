- 108
expected_tool_calls:
- get_pr
- review_pr
grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: review_pr
      action_id: alex_186_review_pr
      path: result.ok
      value: true
      check_id: alex_186_00
    - type: field_equals
      tool: get_pr
      action_id: alex_186_read_pr
      path: result.pr.id
      value: shard-keeper#4216
      check_id: alex_186_01
    - type: field_equals
      path: result.review.pr_id
      value: shard-keeper#4216
      tool: review_pr
      action_id: alex_186_review_pr
      check_id: alex_186_02
    - type: field_equals
      path: result.review.decision
      value: request_changes
      tool: review_pr
      action_id: alex_186_review_pr
      check_id: alex_186_03
    - type: field_llm_judge
      path: result.review.body
      criterion: The review says the active production contract has shard-keeper emit
        storage_region and rollup-service read storage_region. Returning the producer
        to shard_region while deferring the consumer change would create a blocking
        mismatch; the review also asks for cross-service evidence rather than shard-keeper
        unit tests alone.
      tool: review_pr
      action_id: alex_186_review_pr
      check_id: alex_186_04
