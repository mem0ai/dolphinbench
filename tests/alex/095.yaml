id: 095
narrative_anchor_date: '2028-01-01'
test: Create an "Infra release review" event for January 12, 2028 from 2:00 to 2:45
  PM Eastern with infra-release@example.com and product-eng@example.com, and add the
  appropriate internal review surface to the agenda.
load_bearing_facts:
- 92
- 93
expected_tool_calls:
- create_calendar_event
grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: create_calendar_event
      action_id: alex_095_create_calendar_event
      path: result.ok
      value: true
      check_id: alex_095_00
    - type: field_equals
      path: result.event.title
      value: Infra release review
      tool: create_calendar_event
      action_id: alex_095_create_calendar_event
      check_id: alex_095_01
    - type: datetime_absolute_eq
      path: result.event.start
      value: '2028-01-12T14:00:00-05:00'
      tool: create_calendar_event
      action_id: alex_095_create_calendar_event
      check_id: alex_095_02
    - type: datetime_absolute_eq
      path: result.event.end
      value: '2028-01-12T14:45:00-05:00'
      tool: create_calendar_event
      action_id: alex_095_create_calendar_event
      check_id: alex_095_03
    - type: field_list_includes
      path: result.event.attendees
      values:
      - infra-release@example.com
      - product-eng@example.com
      tool: create_calendar_event
      action_id: alex_095_create_calendar_event
      check_id: alex_095_04
    - type: field_llm_judge
      path: result.event.body
      criterion: The agenda names Lantern as the internal review surface for this
        selected Infra and Product Engineering release review and does not imply general
        or unrestricted availability.
      tool: create_calendar_event
      action_id: alex_095_create_calendar_event
      check_id: alex_095_05
mock_state: {}
mock_state_base:
  path: state.json
  sha256: b2e9b6b9e0f48ec23e9ae5ec4d803c050db6c6914dfc1d47ccdf545b3c77b68a
