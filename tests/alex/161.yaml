id: '161'
narrative_anchor_date: '2028-01-01'
test: Create a "Lantern renewal review" event for March 23, 2028 from 10:30 to 11:15
  AM Eastern with hema@sphere.example, theo@sphere.example, iris@sphere.example, and
  product-engineering@sphere.example. In the notes, state which customers were authorized,
  the allowed access, the exact term, and that scheduling the meeting does not renew,
  expand, or change access.
load_bearing_facts:
- 278
expected_tool_calls:
- create_calendar_event
grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: create_calendar_event
      action_id: alex_161_create_calendar_event
      path: result.ok
      value: true
      check_id: alex_161_00
    - type: field_equals
      path: result.event.title
      value: Lantern renewal review
      tool: create_calendar_event
      action_id: alex_161_create_calendar_event
      check_id: alex_161_01
    - type: datetime_absolute_eq
      path: result.event.start
      value: '2028-03-23T10:30:00-04:00'
      tool: create_calendar_event
      action_id: alex_161_create_calendar_event
      check_id: alex_161_02
    - type: datetime_absolute_eq
      path: result.event.end
      value: '2028-03-23T11:15:00-04:00'
      tool: create_calendar_event
      action_id: alex_161_create_calendar_event
      check_id: alex_161_03
    - type: field_list_includes
      path: result.event.attendees
      values:
      - hema@sphere.example
      - theo@sphere.example
      - iris@sphere.example
      - product-engineering@sphere.example
      tool: create_calendar_event
      action_id: alex_161_create_calendar_event
      check_id: alex_161_04
    - type: field_llm_judge
      path: result.event.body
      criterion: The notes say Harbor Health and Mosaic Commerce are the only authorized
        accounts for a read-only term from October 1, 2027 through March 31, 2028,
        and that scheduling the review does not itself renew, expand, or change access.
      tool: create_calendar_event
      action_id: alex_161_create_calendar_event
      check_id: alex_161_05
mock_state: {}
mock_state_base:
  path: state.json
  sha256: b2e9b6b9e0f48ec23e9ae5ec4d803c050db6c6914dfc1d47ccdf545b3c77b68a
