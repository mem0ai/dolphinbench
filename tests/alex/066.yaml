  - id: lantern#1608
    title: 'lantern v0: consolidate event writes and card state'
    author: mara
    repo: lantern
    branch: mara/consolidated-event-state
    status: open
    reviewers:
    - alex
    assignees:
    - mara
    opened_at: '2027-12-29T10:15:00-05:00'
    description: This keeps the v0 API shape but consolidates ingestion and card rendering
      around one canonical record.
    changes:
    - Adds `lantern_event_state` with columns `event_id`, `event_type`, `tenant_id`,
      `service_id`, `occurred_at`, `payload_json`, `current_status`, `current_owner`,
      `incident_count`, `card_title`, `card_badge`, `card_sort_key`, nullable `source_system`,
      nullable `source_record_id`, nullable `source_observed_at`, and `updated_at`.
    - Ingestion uses `INSERT ... ON CONFLICT (event_id) DO UPDATE` to replace payload,
      status, ownership, incident, presentation, provenance, and update-time fields
      on the existing row.
    - '`current_status` is TEXT. Any non-empty producer value is accepted; new values
      require no schema migration, and the UI title-cases values it has not seen before.'
    - The provenance columns remain nullable, and provenance validation is skipped
      when a producer cannot supply them.
    - The card endpoint queries `lantern_event_state` directly and uses the `card_*`
      columns from that same write row; it does not materialize a separate read model.
    tests:
    - last write wins for repeated event IDs
    - unknown producer status is displayed after title-casing
    - records without source metadata are accepted
    - card endpoint reflects the latest write row
