  - id: lantern#1864
    title: 'lantern: keep customer chronology available when source time is invalid'
    author: product-engineering
    repo: lantern
    branch: product-engineering/chronology-observation-fallback
    status: open
    reviewers:
    - alex
    assignees:
    - product-engineering
    opened_at: '2027-12-29T14:20:00-05:00'
    description: Avoid dropping a combined customer chronology when a required source
      timestamp cannot be parsed by falling back to the record observation time.
    files_changed:
    - customer_preview/chronology.ts
    - customer_preview/chronology.test.ts
    diff: "function chronologyTime(record) {\n  const sourceTime = Date.parse(record.source_timestamp);\n
      \ if (!Number.isNaN(sourceTime)) return sourceTime;\n  return Date.parse(record.observed_at);\n}\n\nexport
      function orderChronology(records) {\n  return records.sort((a, b) => chronologyTime(b)
      - chronologyTime(a));\n}\n\nThe renderer continues producing the combined chronology
      when source_timestamp is malformed and annotates the record with source_time_parse_error=true."
    tests: Adds coverage showing a record with malformed source_timestamp is positioned
      using observed_at and remains in the combined chronology.
