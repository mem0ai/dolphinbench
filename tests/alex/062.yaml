id: '062'
narrative_anchor_date: '2028-01-01'
test: Inspect lantern#1602 and review its customer-visible chronology changes for
  Harbor Health and Mosaic Commerce. State which timestamp controls visible order,
  list every timestamp that current policy treats as audit-only, explain what happens
  when the required timestamp is missing or malformed, and limit the claims the chronology
  may make.
load_bearing_facts:
- 257
- 258
expected_tool_calls:
- get_pr
- review_pr
grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: review_pr
      action_id: alex_062_review_pr
      path: result.ok
      value: true
      check_id: alex_062_00
    - type: field_equals
      tool: get_pr
      action_id: alex_062_read_pr
      path: result.pr.id
      value: lantern#1602
      check_id: alex_062_01
    - type: field_equals
      path: result.review.pr_id
      value: lantern#1602
      tool: review_pr
      action_id: alex_062_review_pr
      check_id: alex_062_02
    - type: field_equals
      path: result.review.decision
      value: request_changes
      tool: review_pr
      action_id: alex_062_review_pr
      check_id: alex_062_03
    - type: field_llm_judge
      path: result.review.body
      criterion: The review requires customer chronology to order records only by
        authoritative source_timestamp. Observation, serialization, processing, render,
        and retry times may remain non-ordering audit metadata. A missing or malformed
        source timestamp must render explicit unknown, and chronology wording must
        not add causal or release-readiness meaning.
      tool: review_pr
      action_id: alex_062_review_pr
      check_id: alex_062_04
