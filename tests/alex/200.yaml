id: '200'
narrative_anchor_date: '2028-01-01'
test: Prospect Park paths are not icy on January 5, 2028. Check this week's Infra
  on-call roster and my calendar, then create my regular run if its conditions are
  met.
load_bearing_facts:
- 200
expected_tool_calls:
- list_oncall_schedule
- list_calendar_events
- create_calendar_event
grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: create_calendar_event
      action_id: alex_200_create_calendar_event
      path: result.ok
      value: true
      check_id: alex_200_00
    - type: tool_called
      tool: list_oncall_schedule
      action_id: alex_200_list_oncall_schedule
      check_id: alex_200_01
    - type: tool_called
      tool: list_calendar_events
      action_id: alex_200_list_calendar_events
      check_id: alex_200_02
    - type: field_equals
      path: result.event.title
      value: Prospect Park run
      tool: create_calendar_event
      action_id: alex_200_create_calendar_event
      check_id: alex_200_03
    - type: datetime_absolute_eq
      path: result.event.start
      value: '2028-01-05T07:15:00-05:00'
      tool: create_calendar_event
      action_id: alex_200_create_calendar_event
      check_id: alex_200_04
    - type: datetime_absolute_eq
      path: result.event.end
      value: '2028-01-05T07:45:00-05:00'
      tool: create_calendar_event
      action_id: alex_200_create_calendar_event
      check_id: alex_200_05
