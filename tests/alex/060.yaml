id: '060'
narrative_anchor_date: '2028-01-01'
test: Create a January 9, 2028 9:30-10:30 AM Eastern cortado-and-crossword event at
  my usual Park Slope cafe, including enough location detail to identify it.
load_bearing_facts:
- 1
expected_tool_calls:
- create_calendar_event
grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: create_calendar_event
      action_id: alex_060_create_calendar_event
      path: result.ok
      value: true
      check_id: alex_060_00
    - type: datetime_absolute_eq
      path: result.event.start
      value: '2028-01-09T09:30:00-05:00'
      tool: create_calendar_event
      action_id: alex_060_create_calendar_event
      check_id: alex_060_01
    - type: datetime_absolute_eq
      path: result.event.end
      value: '2028-01-09T10:30:00-05:00'
      tool: create_calendar_event
      action_id: alex_060_create_calendar_event
      check_id: alex_060_02
    - type: field_llm_judge
      path: result.event.body
      criterion: The event identifies the cafe as the 7th Avenue spot in Park Slope
        on the same block as the bagel place and on the opposite corner.
      tool: create_calendar_event
      action_id: alex_060_create_calendar_event
      check_id: alex_060_03
mock_state: {}
mock_state_base:
  path: state.json
  sha256: b2e9b6b9e0f48ec23e9ae5ec4d803c050db6c6914dfc1d47ccdf545b3c77b68a
