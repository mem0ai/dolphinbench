- 16
expected_tool_calls:
- get_pr
- post_pr_comment
grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: post_pr_comment
      action_id: alex_094_post_pr_comment
      path: result.ok
      value: true
      check_id: alex_094_00
    - type: field_equals
      tool: get_pr
      action_id: alex_094_read_pr
      path: result.pr.id
      value: metrics-pipeline-history#931
      check_id: alex_094_01
    - type: field_equals
      path: result.comment.pr_id
      value: metrics-pipeline-history#931
      tool: post_pr_comment
      action_id: alex_094_post_pr_comment
      check_id: alex_094_02
    - type: field_llm_judge
      path: result.comment.body
      criterion: The comment says metrics-router was already at 30% rollout on March
        28, 2023, contradicting the claim that it began in April at majority traffic.
        It does not claim the source proves March 28 was the first day of the cutover.
      tool: post_pr_comment
      action_id: alex_094_post_pr_comment
      check_id: alex_094_03
