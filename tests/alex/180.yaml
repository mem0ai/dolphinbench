id: '180'
narrative_anchor_date: '2028-01-01'
test: Inspect otel-schema#590 and review its production deployment.environment behavior
  across the metrics path. State the allowed and rejected values, missing-input behavior,
  per-tenant limit, and every production component that must show parity.
load_bearing_facts:
- 121
expected_tool_calls:
- get_pr
- review_pr
grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: review_pr
      action_id: alex_180_review_pr
      path: result.ok
      value: true
      check_id: alex_180_00
    - type: field_equals
      tool: get_pr
      action_id: alex_180_read_pr
      path: result.pr.id
      value: otel-schema#590
      check_id: alex_180_01
    - type: field_equals
      path: result.review.pr_id
      value: otel-schema#590
      tool: review_pr
      action_id: alex_180_review_pr
      check_id: alex_180_02
    - type: field_equals
      path: result.review.decision
      value: request_changes
      tool: review_pr
      action_id: alex_180_review_pr
      check_id: alex_180_03
    - type: field_llm_judge
      path: result.review.body
      criterion: The review requires mixed-case allowed inputs to normalize only to
        prod, staging, or dev; missing input to omit the label; unknown, qa, malformed,
        and arbitrary raw values to be rejected before publication without creating
        a series; no more than three distinct values per tenant; and parity through
        production OTel ingestion, metrics-router, and rollup-service.
      tool: review_pr
      action_id: alex_180_review_pr
      check_id: alex_180_04
