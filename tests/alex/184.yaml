  - id: shard-keeper#4210
    title: 'shard-keeper: add polling grace period during lease handoff'
    author: mira
    repo: shard-keeper
    branch: mira/lease-handoff-grace
    status: open
    reviewers:
    - alex
    assignees:
    - mira
    opened_at: '2027-12-29T10:20:00-05:00'
    description: Reduce brief unavailability during lease handoff by allowing the
      former holder to keep answering for up to 750 ms while the successor starts
      serving.
    implementation:
      files:
      - src/lease/holder.ts
      - src/routing/serve_gate.ts
      - test/lease/handoff.test.ts
      summary: On lease-loss notification, start a 750 ms grace deadline but leave
        the former holder's serving gate open. The periodic ownership poll closes
        that gate once it observes a successor, or the grace deadline closes it if
        the poll has not done so. Successor acquisition and serving are not delayed
        by the former holder's grace period.
      pseudocode:
      - 'onLeaseLost(): graceUntil = now + 750ms; schedulePoll()'
      - 'canServe(): return ownsLease || now < graceUntil'
      - 'pollOwnership(): if successorObserved || now >= graceUntil then closeServingGate()'
    tests:
    - name: former holder serves while successor warms
      assertion: Requests remain available while the successor begins serving; both
        holders may return successful responses during the grace interval.
    - name: grace expires without poll observation
      assertion: The old gate closes no later than 750 ms after lease loss.
    - name: poll shortens grace
      assertion: The old gate closes when a poll observes the successor.
    ci:
      status: passing
