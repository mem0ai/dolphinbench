- get_pr
- review_pr
grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: review_pr
      action_id: alex_184_review_pr
      path: result.ok
      value: true
      check_id: alex_184_00
    - type: field_equals
      tool: get_pr
      action_id: alex_184_read_pr
      path: result.pr.id
      value: shard-keeper#4210
      check_id: alex_184_01
    - type: field_equals
      path: result.review.pr_id
      value: shard-keeper#4210
      tool: review_pr
      action_id: alex_184_review_pr
      check_id: alex_184_02
    - type: field_equals
      path: result.review.decision
      value: request_changes
      tool: review_pr
      action_id: alex_184_review_pr
      check_id: alex_184_03
    - type: field_llm_judge
      path: result.review.body
      criterion: The review says production revocations preserved exactly one serving
        holder, closed the old holder's serving gate on lease-loss notification before
        another routing response, and produced no stale reads. It rejects a polling
        or grace-period gate and says polling is only a backup detector. It requires
        evidence for holder count, gate-close latency, stale responses, replacement
        acquisition, p99 latency, errors, and restarts.
      tool: review_pr
      action_id: alex_184_review_pr
      check_id: alex_184_04
