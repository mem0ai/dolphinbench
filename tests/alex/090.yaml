      path: result.review.pr_id
      value: infra-runbooks#1882
      tool: review_pr
      action_id: alex_090_review_pr
      check_id: alex_090_02
    - type: field_equals
      path: result.review.decision
      value: request_changes
      tool: review_pr
      action_id: alex_090_review_pr
      check_id: alex_090_03
    - type: field_llm_judge
      path: result.review.body
      criterion: The review restores the team-wide ban on Friday-afternoon production
        deployments, the requirement to page the secondary within 45 minutes while
        the primary is still handling an incident, and the runbook-ownership audit
        with Nadia cross-reviewing relevant service sections. It says the shard-keeper
        migration was paused pending that audit rather than continuing immediately.
      tool: review_pr
      action_id: alex_090_review_pr
      check_id: alex_090_04
