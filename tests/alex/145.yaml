    author: product-engineering
    repo: lantern
    branch: product-engineering/normalize-authority-reference
    status: open
    reviewers:
    - alex
    assignees:
    - product-engineering
    opened_at: '2027-12-29T14:20:00-05:00'
    description: Refactors the internal reference slice so references for a canonical
      service are normalized into one generic authority object, then makes that normalized
      object available to the customer renderer.
    changes:
    - file: src/references/normalizeAuthority.ts
      summary: Groups owner-map and Cardinality Guardrails references by tenant_id
        and canonical_service_id and emits one generic authority object per service.
        The emitted object has a single authority_record_id and source_timestamp selected
        from the grouped references.
    - file: src/renderers/customer/serviceAuthority.ts
      summary: Enables the normalized authority object in the shared customer renderer
        used by Harbor Health and Mosaic Commerce.
    - file: tests/customer/serviceAuthority.test.ts
      summary: Adds customer-renderer fixtures expecting one normalized authority
        object when a service has both owner-map and Cardinality Guardrails inputs.
