  - id: metrics-router#1318
    title: 'metrics-router: raise tenant pending-batch limit and remove global queue
      cap'
    author: rhea
    repo: metrics-router
    branch: rhea/expand-pending-batches
    status: open
    reviewers:
    - alex
    assignees:
    - rhea
    opened_at: '2027-12-29T10:20:00-05:00'
    body: '## Rationale

      The October 2025 Mosaic production observation proves that the existing tenant-bounded
      control lost accepted work under load. The retryable queue-full responses are
      evidence that accepted batches were discarded once tenants reached the pending-batch
      ceiling. We should therefore allow substantially more pending work per tenant
      and remove the global aggregate cap.


      ## Changes

      - Raise `max_pending_batches_per_tenant` to 256.

      - Delete `GLOBAL_PENDING_BATCH_LIMIT` and the corresponding aggregate admission
      check.

      - Retain the existing retry response for the remaining per-tenant refusal path.


      ## Expected effect

      Large tenants can accumulate more pending batches without encountering the current
      queue-full behavior, and aggregate queue capacity is no longer constrained by
      a process-wide constant.'
    files:
    - path: src/queue/config.rs
      patch: '- pub const GLOBAL_PENDING_BATCH_LIMIT: usize = 2048;

        - pub const MAX_PENDING_BATCHES_PER_TENANT: usize = 64;

        + pub const MAX_PENDING_BATCHES_PER_TENANT: usize = 256;'
    - path: src/queue/admission.rs
      patch: "- if global_pending >= GLOBAL_PENDING_BATCH_LIMIT {\n-     return Err(QueueFull::retryable());\n-
        }\n  if tenant_pending >= MAX_PENDING_BATCHES_PER_TENANT {\n      return Err(QueueFull::retryable());\n
        \ }"
