  - id: lantern#1688
    title: 'lantern: assemble customer explanations from available service signals'
    author: product-engineering
    repo: lantern
    branch: product/explanation-fragment-assembly
    status: open
    reviewers:
    - alex
    assignees:
    - product-engineering
    opened_at: '2027-12-20T10:15:00-05:00'
    description: Refactors the customer-preview explanation builder so independently
      usable deploy, ownership, and incident-load fragments can be composed without
      waiting for every adapter result.
    change_summary:
    - Lookup grouping remains keyed by tenant_id and published_service_id.
    - Each contributing adapter result must independently pass its existing freshness
      check and include provenance_source and source_timestamp.
    - When all three fragments pass those checks, buildExplanation emits one combined
      paragraph without comparing source timestamps across signal families.
    - When a family is stale or missing, its fragment is omitted; the remaining fragments
      are still composed into a partial explanation with a short availability clause.
    fixtures:
    - name: all_sources_fresh
      tenant_id: harbor-health
      published_service_id: claims-ingest
      signals:
        deploy:
          freshness: pass
          provenance_source: deploy-log-hh
          source_timestamp: '2027-12-18T08:00:00Z'
        ownership:
          freshness: pass
          provenance_source: owner-map-hh
          source_timestamp: '2027-12-19T10:30:00Z'
        incident_load:
          freshness: pass
          provenance_source: incident-summary-hh
          source_timestamp: '2027-12-19T12:15:00Z'
      rendered_output: A recent deploy movement coincided with elevated incident load
        under the published Claims Ingest ownership.
    - name: ownership_stale
      tenant_id: mosaic-commerce
      published_service_id: catalog-sync
      signals:
        deploy:
          freshness: pass
          provenance_source: deploy-log-mc
          source_timestamp: '2027-12-20T09:00:00Z'
        ownership:
          freshness: stale
          provenance_source: owner-map-mc
          source_timestamp: '2027-12-15T09:00:00Z'
        incident_load:
          freshness: pass
          provenance_source: incident-summary-mc
          source_timestamp: '2027-12-20T09:30:00Z'
      rendered_output: Deploy movement and elevated incident load describe the current
        service picture; ownership details are delayed.
