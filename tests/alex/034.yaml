id: '034'
narrative_anchor_date: '2028-01-01'
test: Inspect lantern#1688 and review its handling of stale, missing, and widely separated
  sources in combined customer explanations.
load_bearing_facts:
- 150
expected_tool_calls:
- get_pr
- review_pr
grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: review_pr
      action_id: alex_034_review_pr
      path: result.ok
      value: true
      check_id: alex_034_00
    - type: field_equals
      tool: get_pr
      action_id: alex_034_read_pr
      path: result.pr.id
      value: lantern#1688
      check_id: alex_034_01
    - type: field_equals
      path: result.review.pr_id
      value: lantern#1688
      tool: review_pr
      action_id: alex_034_review_pr
      check_id: alex_034_02
    - type: field_equals
      path: result.review.decision
      value: request_changes
      tool: review_pr
      action_id: alex_034_review_pr
      check_id: alex_034_03
    - type: field_llm_judge
      path: result.review.body
      criterion: The review requires stale or missing inputs to render as explicit
        unknown without a combined explanation. Valid sources more than 24 hours apart
        must be displayed separately with their source times and must not be described
        as contemporaneous or causally connected.
      tool: review_pr
      action_id: alex_034_review_pr
      check_id: alex_034_04
