    body: Adds read-only authority-reference navigation to the customer service drawer
      for Harbor Health and Mosaic Commerce. The drawer gains an Owner record link
      backed by the owner-map authority_record_id and a Guardrail context link backed
      by the Cardinality Guardrails authority record. The links open the existing
      staff reference pages; no authority payload is copied into Lantern and there
      is no writeback. The primary Lantern view continues to use the shared authorization
      wrapper. The feature flag is limited to these two customer accounts.
    diff_summary: Render owner-map and Cardinality Guardrails reference links when
      the account is Harbor Health or Mosaic Commerce. Link destinations use the existing
      internal staff reference gateway. Add component tests confirming that the links
      appear only for those two accounts and that no reference payload is returned
      before a user follows a link.
