    assertions:
    - type: field_equals
      tool: review_pr
      action_id: alex_162_review_pr
      path: result.ok
      value: true
      check_id: alex_162_00
    - type: field_equals
      tool: get_pr
      action_id: alex_162_read_pr
      path: result.pr.id
      value: lantern#947
      check_id: alex_162_01
    - type: field_equals
      path: result.review.pr_id
      value: lantern#947
      tool: review_pr
      action_id: alex_162_review_pr
      check_id: alex_162_02
    - type: field_equals
      path: result.review.decision
      value: request_changes
      tool: review_pr
      action_id: alex_162_review_pr
      check_id: alex_162_03
    - type: field_llm_judge
      path: result.review.body
      criterion: The review says internal owner-map and Cardinality Guardrails reference
        navigation is not allowed in either current customer path and must be removed
        or isolated. If that excluded material reaches either path, both accounts
        must be suspended until correction and a successful rerun of the affected
        safety check.
      tool: review_pr
      action_id: alex_162_review_pr
      check_id: alex_162_04
