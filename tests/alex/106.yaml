      evidence. The broader scale-response cycle remains open because the observation
      showed no accepted points lost but did not establish whether any accepted batch
      was lost. The 2,048-batch global queue, 64-pending-batch tenant limit, retryable
      pre-acceptance backpressure path, existing owner map, and Alex's responsibility
      to open any production window remain unchanged; no new queue design or production
