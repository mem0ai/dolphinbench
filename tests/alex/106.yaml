      64 pending batches, no accepted batch is lost, and consistency, parity, dropped-series,
      route, shard-keeper lease, rollup-service, and full-health checks remain at
      baseline throughout. If any condition fails, Alex may not open a capacity-related
      production window until the candidate is revised and a fresh replay passes.
      Neither the October 6 result nor the earlier staged replay substitutes for that
      evidence. Wes's independent handling of the live ramp is retained as formal
