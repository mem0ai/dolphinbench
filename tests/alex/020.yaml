id: '020'
narrative_anchor_date: '2028-01-01'
test: Create a bouldering event with Ren on January 6, 2028 from 7:00 to 9:00 PM Eastern,
  with notes on how I should start the session.
load_bearing_facts:
- 149
expected_tool_calls:
- create_calendar_event
grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: create_calendar_event
      action_id: alex_020_create_calendar_event
      path: result.ok
      value: true
      check_id: alex_020_00
    - type: datetime_absolute_eq
      path: result.event.start
      value: '2028-01-06T19:00:00-05:00'
      tool: create_calendar_event
      action_id: alex_020_create_calendar_event
      check_id: alex_020_01
    - type: datetime_absolute_eq
      path: result.event.end
      value: '2028-01-06T21:00:00-05:00'
      tool: create_calendar_event
      action_id: alex_020_create_calendar_event
      check_id: alex_020_02
    - type: field_llm_judge
      path: result.event.body
      criterion: The notes say to use a longer forearm warmup and increase the climbing
        load progressively rather than starting hard.
      tool: create_calendar_event
      action_id: alex_020_create_calendar_event
      check_id: alex_020_03
    - type: field_list_includes
      path: result.event.attendees
      values:
      - ren@example.com
      tool: create_calendar_event
      action_id: alex_020_create_calendar_event
      check_id: alex_020_04
mock_state: {}
mock_state_base:
  path: state.json
  sha256: b2e9b6b9e0f48ec23e9ae5ec4d803c050db6c6914dfc1d47ccdf545b3c77b68a
