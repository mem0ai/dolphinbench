    status: open
    reviewers:
    - alex
    assignees:
    - devon
    opened_at: '2027-12-29T14:20:00-05:00'
    body: Changes deploy-movement identity to key records by tenant_id, published_service_id,
      provenance_source, and ingestion_attempt_id. When source_event_id is unavailable,
      records with the same service, transition, and a nearby observed timestamp are
      merged heuristically. Current tests cover repeated deliveries carrying the same
      ingestion-attempt ID, but do not include separate rollback and redeploy transitions.
    diff_summary: The movement key now uses ingestion_attempt_id in place of source_event_id.
      A ten-minute similarity window merges records lacking source_event_id when tenant,
      service, provenance, and transition match. Tests assert duplicate delivery suppression
      for a repeated attempt ID.
