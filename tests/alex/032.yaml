id: '032'
narrative_anchor_date: '2028-01-01'
test: Inspect north-pier-design-system#184 and comment with North Pier's current token
  workflow. State the date the formal review's findings were reported, what the review
  established, what source must change, how Android output is produced, how drift
  is blocked, and whether the trial became the ongoing workflow or continued only
  as a trial.
load_bearing_facts:
- 113
expected_tool_calls:
- get_pr
- post_pr_comment
grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: post_pr_comment
      action_id: alex_032_post_pr_comment
      path: result.ok
      value: true
      check_id: alex_032_00
    - type: field_equals
      tool: get_pr
      action_id: alex_032_read_pr
      path: result.pr.id
      value: north-pier-design-system#184
      check_id: alex_032_01
    - type: field_equals
      path: result.comment.pr_id
      value: north-pier-design-system#184
      tool: post_pr_comment
      action_id: alex_032_post_pr_comment
      check_id: alex_032_02
    - type: field_llm_judge
      path: result.comment.body
      criterion: Says the formal review reported on June 20, 2024 established the
        versioned canonical token package, generated downstream files including Android
        output, and an automated drift check as North Pier's ongoing workflow rather
        than an extension of the trial. Says to change the canonical package, regenerate
        Android output, and make automation block drift between the source package
        and generated output.
      tool: post_pr_comment
      action_id: alex_032_post_pr_comment
      check_id: alex_032_03
