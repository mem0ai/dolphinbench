    body: '## Summary

      Add a temporary escape hatch that routes live production metrics to legacy-aggregator
      if the OTel/Prometheus path degrades during the transition.


      ## Proposed behavior

      - Register legacy-aggregator as a live fallback target.

      - Add a feature flag that switches production routing to it when OTel/Prometheus
      health falls below the rollout threshold.

      - Document legacy-aggregator as the rollback destination in the transition runbook.


      Please review the production-transition safety of this fallback design.'
