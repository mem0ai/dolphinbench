id: '181'
narrative_anchor_date: '2028-01-01'
test: Inspect sdk-rust#2088 and review it against the current oversized-batch contract.
load_bearing_facts:
- 145
- 146
expected_tool_calls:
- get_pr
- review_pr
grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: review_pr
      action_id: alex_181_review_pr
      path: result.ok
      value: true
      check_id: alex_181_00
    - type: field_equals
      tool: get_pr
      action_id: alex_181_read_pr
      path: result.pr.id
      value: sdk-rust#2088
      check_id: alex_181_01
    - type: field_equals
      path: result.review.pr_id
      value: sdk-rust#2088
      tool: review_pr
      action_id: alex_181_review_pr
      check_id: alex_181_02
    - type: field_equals
      path: result.review.decision
      value: request_changes
      tool: review_pr
      action_id: alex_181_review_pr
      check_id: alex_181_03
    - type: field_llm_judge
      path: result.review.body
      criterion: The review requires the SDK to reject batches above 8,000 points
        before transmission and tell callers to split them. Ingest-edge remains a
        backstop for older or nonconforming clients and must reject the whole oversized
        batch with HTTP 413, zero accepted points, rejected points equal to the submitted
        count, and oversized_batch as the reason. It rejects partial acceptance.
      tool: review_pr
      action_id: alex_181_review_pr
      check_id: alex_181_04
