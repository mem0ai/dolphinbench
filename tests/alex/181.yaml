  - id: sdk-rust#2088
    title: Allow ingest-edge to partially accept oversized metric batches
    author: mira
    repo: sdk-rust
    branch: mira/partial-oversized-batches
    status: open
    reviewers:
    - alex
    assignees:
    - mira
    opened_at: '2027-12-29T14:20:00-05:00'
    description: Removes the SDK's 8,000-point validation so callers can submit larger
      batches. The implementation expects ingest-edge to keep the prefix that fits,
      report accepted_points and rejected_points in a 413 response, and lets the caller
      retry the rejected suffix.
    diff_summary: Deletes the MAX_POINTS_PER_BATCH preflight error from batch validation;
      sends the full batch over the network; adds parsing for accepted_points and
      rejected_points on HTTP 413; updates caller documentation to say that ingest-edge
      accepts the first 8,000 points and rejects only the remainder.
