narrative_anchor_date: '2028-01-01'
test: Inspect north-pier-handoff#284 and review whether its android-2028.01.1 handoff
  is implementation-ready.
load_bearing_facts:
- 230
expected_tool_calls:
- get_pr
- review_pr
grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2028-01-01'
    assertions:
    - type: field_equals
      tool: review_pr
      action_id: alex_043_review_pr
      path: result.ok
      value: true
      check_id: alex_043_00
    - type: field_equals
      tool: get_pr
      action_id: alex_043_read_pr
      path: result.pr.id
      value: north-pier-handoff#284
      check_id: alex_043_01
    - type: field_equals
      path: result.review.pr_id
      value: north-pier-handoff#284
      tool: review_pr
      action_id: alex_043_review_pr
      check_id: alex_043_02
    - type: field_equals
      path: result.review.decision
      value: request_changes
      tool: review_pr
      action_id: alex_043_review_pr
      check_id: alex_043_03
    - type: field_llm_judge
      path: result.review.body
      criterion: The review says readiness is blocked because desktop-package is absent,
        web-package lacks generated-artifact metadata, and Android reports canonical
        package version 8.0.7 instead of the handoff's 8.1.0. It requires every manifest
        output to exist with generated metadata matching the handoff's canonical package
        version.
      tool: review_pr
      action_id: alex_043_review_pr
      check_id: alex_043_04
