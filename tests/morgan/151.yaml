id: '151'
narrative_anchor_date: '2026-09-14'
test: Fetch metrics for the service set in my April 28, 2023 batch-metrics note and
  create a short document summarizing the returned metrics.
load_bearing_facts:
- 90
expected_tool_calls:
- metrics_fetch_batch
- create_doc
grade:
  type: tool_trace
  config:
    check_version: 2
    today: '2026-09-14'
    assertions:
    - type: field_equals
      tool: metrics_fetch_batch
      path: result.ok
      value: true
      check_id: morgan_151_00
      action_id: morgan_151_metrics_fetch_batch
    - type: field_list_equals_unordered
      path: args.services
      values:
      - api-gateway
      - auth-svc
      - billing-svc
      - inventory-svc
      - notifications-svc
      - payments-svc
      - search-svc
      - recommendations-svc
      tool: metrics_fetch_batch
      check_id: morgan_151_01
      action_id: morgan_151_metrics_fetch_batch
    - type: field_equals
      tool: create_doc
      path: result.ok
      value: true
      check_id: morgan_151_02
      action_id: morgan_151_create_doc
