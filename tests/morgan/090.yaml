test: 'Create a draft document titled Sep 14 manager note from the notes below.


  Notes:

  The September read should stay bounded. There is a distinction between reporting
  the evidence we have and turning the review into a new decision process. This note
  is for the former. Owner responsibilities remain intact; nobody should read the
  review as a reassignment of the work or a reason to open a parallel owner thread.
  Account-thread evidence questions should go to Sarah. That belongs in the note so
  people know where to send questions rather than distributing them across the group.
  There is no hiring decision today. The review is not an instruction to start one,
  and the wording should not imply that a staffing approval has happened. The central
  point is to report the September evidence while keeping the existing responsibilities
  clear.'
