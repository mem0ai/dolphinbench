        ## Decision

        We are no longer treating Mercury pricing as a pure-MAU-versus-pure-seat debate.
        For new Mercury design-partner and post-launch quotes, use the hybrid model
        below.


        ## Quote guidance

        - Pilot platform minimum: $2,500/month, including up to 50 monthly active
        developers

        - Growth platform minimum: $7,500/month, including up to 200 monthly active
        developers

        - Overage: $1,000 per additional 50 monthly active developers

        - Enterprise add-ons such as SSO, audit logs, and advanced admin controls
        are quoted separately only after those features actually ship


        ## Rationale

        This keeps the usage-ramp logic honest while giving Devon a cleaner floor
